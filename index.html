<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Coffee Loyalty - Login</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script type="module">
    // Firebase imports
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js";
    import {
      getAuth,
      signInWithEmailAndPassword,
      createUserWithEmailAndPassword,
    } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-auth.js";
    import {
      getFirestore,
      doc,
      setDoc,
      getDoc
    } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-firestore.js";

    // === Firebase Config ===
    const firebaseConfig = {
      apiKey: "AIzaSyAWZg7mZe1j2Nwkg5JvPUjf_bdCvfWvN9g",
      authDomain: "kopi-copybara.firebaseapp.com",
      projectId: "kopi-copybara",
      storageBucket: "kopi-copybara.firebasestorage.app",
      messagingSenderId: "729875984861",
      appId: "1:729875984861:web:6b1ea2d44f8789c18e4634"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    document.addEventListener("DOMContentLoaded", () => {
      const registerForm = document.getElementById("registerForm");
      const loginForm = document.getElementById("loginForm");
      const toggleRegister = document.getElementById("toggleRegister");
      const toggleLogin = document.getElementById("toggleLogin");
      const registerSection = document.getElementById("registerSection");
      const loginSection = document.getElementById("loginSection");

      // === Toggle between Register & Login ===
      toggleRegister.addEventListener("click", () => {
        loginSection.classList.add("hidden");
        registerSection.classList.remove("hidden");
      });

      toggleLogin.addEventListener("click", () => {
        registerSection.classList.add("hidden");
        loginSection.classList.remove("hidden");
      });

      // === REGISTER ===
      registerForm.addEventListener("submit", async (e) => {
        e.preventDefault();
        const name = document.getElementById("regName").value.trim();
        const email = document.getElementById("regEmail").value.trim();
        const password = document.getElementById("regPassword").value.trim();
        const role = document.getElementById("regRole").value;
        const masterKey = document.getElementById("masterKey").value.trim();

        if (role === "staff" && masterKey !== "230412") {
          alert("Invalid master password for staff registration!");
          return;
        }

        try {
          const userCredential = await createUserWithEmailAndPassword(auth, email, password);
          const user = userCredential.user;

          // Save user info to Firestore
          await setDoc(doc(db, "users", user.uid), {
            name,
            email,
            role,
            points: 0,
          });

          alert("Registration successful! You can now login.");
          registerForm.reset();
          registerSection.classList.add("hidden");
          loginSection.classList.remove("hidden");
        } catch (error) {
          alert("Registration failed: " + error.message);
        }
      });

      // === LOGIN ===
      loginForm.addEventListener("submit", async (e) => {
        e.preventDefault();
        const emailOrPhone = document.getElementById("loginEmail").value.trim();
        const password = document.getElementById("loginPassword").value.trim();

        try {
          // Allow login with email only for now (Firebase Auth)
          const userCredential = await signInWithEmailAndPassword(auth, emailOrPhone, password);
          const user = userCredential.user;

          // Fetch user details
          const userDoc = await getDoc(doc(db, "users", user.uid));
          if (!userDoc.exists()) {
            alert("User data not found.");
            return;
          }

          const userData = userDoc.data();
          sessionStorage.setItem("userName", userData.name);
          sessionStorage.setItem("userRole", userData.role);
          sessionStorage.setItem("userPoints", userData.points);

          // Reset form
          loginForm.reset();

          // Redirect based on role
          if (userData.role === "staff") {
            window.location.href = "transaction.html";
          } else {
            window.location.href = "redeem.html";
          }
        } catch (error) {
          alert("Login failed: " + error.message);
        }
      });

      // === Show Master Password only if staff selected ===
      document.getElementById("regRole").addEventListener("change", (e) => {
        const val = e.target.value;
        const masterDiv = document.getElementById("masterDiv");
        if (val === "staff") {
          masterDiv.classList.remove("hidden");
        } else {
          masterDiv.classList.add("hidden");
        }
      });
    });
  </script>
</head>
<body class="min-h-screen flex items-center justify-center bg-gradient-to-br from-amber-100 to-amber-200">
  <div class="bg-white shadow-lg rounded-2xl w-full max-w-md p-8 space-y-6">
    <h2 class="text-3xl font-bold text-center text-amber-800">☕ Coffee Loyalty Login</h2>

    <!-- LOGIN SECTION -->
    <section id="loginSection">
      <form id="loginForm" class="space-y-4 mt-4">
        <input type="text" id="loginEmail" placeholder="Email" class="w-full p-3 border rounded-lg focus:ring-2 focus:ring-amber-500" required>
        <input type="password" id="loginPassword" placeholder="Password" class="w-full p-3 border rounded-lg focus:ring-2 focus:ring-amber-500" required>
        <button type="submit" class="w-full bg-amber-600 text-white py-2 rounded-lg hover:bg-amber-700 transition">Login</button>
      </form>

      <p class="text-center text-sm mt-4">
        Don't have an account? <button id="toggleRegister" class="text-amber-600 font-semibold hover:underline">Register</button>
      </p>
    </section>

    <!-- REGISTER SECTION -->
    <section id="registerSection" class="hidden">
      <form id="registerForm" class="space-y-4 mt-4">
        <input type="text" id="regName" placeholder="Full Name" class="w-full p-3 border rounded-lg focus:ring-2 focus:ring-amber-500" required>
        <input type="email" id="regEmail" placeholder="Email" class="w-full p-3 border rounded-lg focus:ring-2 focus:ring-amber-500" required>
        <input type="password" id="regPassword" placeholder="Password" class="w-full p-3 border rounded-lg focus:ring-2 focus:ring-amber-500" required>

        <select id="regRole" class="w-full p-3 border rounded-lg focus:ring-2 focus:ring-amber-500" required>
          <option value="">Select Role</option>
          <option value="member">Member</option>
          <option value="staff">Staff</option>
        </select>

        <div id="masterDiv" class="hidden">
          <input type="password" id="masterKey" placeholder="Master Password for Staff" class="w-full p-3 border rounded-lg focus:ring-2 focus:ring-red-400">
        </div>

        <button type="submit" class="w-full bg-amber-600 text-white py-2 rounded-lg hover:bg-amber-700 transition">Register</button>
      </form>

      <p class="text-center text-sm mt-4">
        Already have an account? <button id="toggleLogin" class="text-amber-600 font-semibold hover:underline">Login</button>
      </p>
    </section>
  </div>
</body>
</html>
