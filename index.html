  <style>
    body {
      font-family: 'Poppins', sans-serif;
      background-color: #f0f3f7;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
    }
    .login-container {
      background: white;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0px 4px 15px rgba(0,0,0,0.1);
      width: 340px;
    }
    input, select, button {
      width: 100%;
      margin-top: 10px;
      padding: 12px;
      border-radius: 6px;
      border: 1px solid #ccc;
    }
    button {
      background: #007bff;
      color: white;
      font-weight: bold;
      border: none;
      cursor: pointer;
    }
    button:hover {
      background: #0056b3;
    }
  </style>
</head>
<body>
  <div class="login-container">
    <h2>Login</h2>
    <input type="text" id="emailOrPhone" placeholder="Email or Phone Number">
    <input type="password" id="password" placeholder="Password">
    <select id="role">
      <option value="member">Member</option>
      <option value="staff">Staff</option>
    </select>
    <button onclick="login()">Login</button>
    <p id="message"></p>
  </div>

  <script>
    async function login() {
      const emailOrPhone = document.getElementById("emailOrPhone").value.trim();
      const password = document.getElementById("password").value.trim();
      const role = document.getElementById("role").value;
      const message = document.getElementById("message");

      if (!emailOrPhone || !password) {
        message.innerText = "Please fill in all fields.";
        return;
      }

      let email = emailOrPhone;

      // 🔹 Check if input is phone number
      if (!email.includes("@")) {
        email = emailOrPhone + "@example.com"; // convert phone to pseudo-email
      }

      try {
        const userCredential = await auth.signInWithEmailAndPassword(email, password);
        const user = userCredential.user;

        // Save role in localStorage
        localStorage.setItem("userRole", role);
        localStorage.setItem("userEmail", emailOrPhone);

        // Redirect based on role
        if (role === "staff") {
          window.location.href = "transaction.html";
        } else {
          window.location.href = "redeem.html";
        }
      } catch (error) {
        message.innerText = "Login failed: " + error.message;
      }
    }
  </script>
</body>
</html>
