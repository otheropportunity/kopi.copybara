<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kopi Copybara - Loyalty Login</title>
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>

  <!-- Firebase Config -->
  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyAWZg7mZe1j2Nwkg5JvPUjf_bdCvfWvN9g",
      authDomain: "kopi-copybara.firebaseapp.com",
      databaseURL: "https://kopi-copybara-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "kopi-copybara",
      storageBucket: "kopi-copybara.appspot.com",
      messagingSenderId: "729875984861",
      appId: "1:729875984861:web:6b1ea2d44f8789c18e4634"
    };
    firebase.initializeApp(firebaseConfig);
  </script>

  <style>
    body {
      background-color: #fffaf0;
      font-family: 'Poppins', sans-serif;
    }
    .card {
      background: white;
      border-radius: 12px;
      padding: 24px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      max-width: 400px;
      margin: 60px auto;
    }
    button { transition: 0.3s; }
    button:hover { opacity: 0.85; }
  </style>
</head>

<body>
  <div class="card">
    <h1 class="text-2xl font-bold text-center text-amber-800 mb-4">
      ☕ Kopi Copybara Loyalty
    </h1>

    <!-- Registration Section -->
    <div id="registerSection">
      <h2 class="text-lg font-semibold mb-2 text-center">New Registration</h2>

      <select id="userType" class="w-full border rounded p-2 mb-3">
        <option value="">-- Select Role --</option>
        <option value="buyer">Member</option>
        <option value="staff">Staff</option>
      </select>

      <input id="regName" class="w-full border rounded p-2 mb-2" placeholder="Full Name" />
      <input id="regPhone" class="w-full border rounded p-2 mb-2" placeholder="Phone Number" />
      <input id="regEmail" type="email" class="w-full border rounded p-2 mb-2" placeholder="Email" />
      <input id="regPassword" type="password" class="w-full border rounded p-2 mb-2" placeholder="Password" />

      <div id="staffMasterDiv" class="hidden">
        <input id="staffMasterPassword" type="password" class="w-full border rounded p-2 mb-2" placeholder="Master Password (for staff)" />
      </div>

      <button onclick="registerUser()" class="w-full bg-amber-700 text-white p-2 rounded-lg mb-4">
        Register
      </button>
    </div>

    <hr class="my-4" />

    <!-- Login Section -->
    <div id="loginSection">
      <h2 class="text-lg font-semibold mb-2 text-center">Login</h2>

      <input id="loginIdentifier" class="w-full border rounded p-2 mb-2" placeholder="Email or Phone Number" />
      <input id="loginPassword" type="password" class="w-full border rounded p-2 mb-3" placeholder="Password" />

      <button onclick="loginUser()" class="w-full bg-green-700 text-white p-2 rounded-lg">
        Login
      </button>
    </div>

    <!-- Hidden Change Password Panel (shows after member login) -->
    <div id="changePassPanel" class="hidden mt-6 border-t pt-4">
      <h2 class="text-lg font-semibold text-center text-amber-800 mb-3">🔑 Change Password</h2>

      <input id="oldPass" type="password" class="w-full border rounded p-2 mb-2" placeholder="Current Password" />
      <input id="newPass" type="password" class="w-full border rounded p-2 mb-2" placeholder="New Password" />
      <input id="confirmPass" type="password" class="w-full border rounded p-2 mb-3" placeholder="Confirm New Password" />

      <button onclick="updatePassword()" class="w-full bg-yellow-600 text-white p-2 rounded-lg mb-2 hover:bg-yellow-700">
        Save Password
      </button>
      <button onclick="logoutUser()" class="w-full bg-gray-300 text-gray-800 p-2 rounded-lg hover:bg-gray-400">
        Logout
      </button>
    </div>
  </div>

  <script>
    const db = firebase.database();
    const staffMasterDiv = document.getElementById('staffMasterDiv');

    // === Show master password for staff registration ===
    document.getElementById('userType').addEventListener('change', function() {
      if (this.value === 'staff') staffMasterDiv.classList.remove('hidden');
      else staffMasterDiv.classList.add('hidden');
    });

    // === Register User ===
    function registerUser() {
      const role = document.getElementById("userType").value;
      const name = document.getElementById("regName").value.trim();
      const phone = document.getElementById("regPhone").value.trim();
      const email = document.getElementById("regEmail").value.trim();
      const password = document.getElementById("regPassword").value.trim();

      if (!role || !name || !phone || !email || !password) return alert("Please fill all fields.");

      if (role === "staff") {
        const master = document.getElementById("staffMasterPassword").value.trim();
        if (master !== "230420") return alert("Invalid master password for staff registration!");
      }

      const userKey = email.replace(/[.@]/g, "_");
      const ref = db.ref(role === "staff" ? "staffs/" + userKey : "buyers/" + userKey);

      ref.set({
        name, phone, email, password, role,
        points: role === "buyer" ? 0 : null,
        createdAt: new Date().toISOString()
      }).then(() => {
        alert(`✅ ${role === "staff" ? "Staff" : "Member"} registered successfully!`);
        document.querySelectorAll("#registerSection input").forEach(i => i.value = "");
        document.getElementById("userType").value = "";
        staffMasterDiv.classList.add('hidden');
      }).catch(err => alert("Error: " + err.message));
    }

    // === Login Logic ===
    function loginUser() {
      const identifier = document.getElementById("loginIdentifier").value.trim();
      const password = document.getElementById("loginPassword").value.trim();
      if (!identifier || !password) return alert("Please fill all login fields.");

      const rolePaths = ["buyers", "staffs"];
      let found = false;

      Promise.all(
        rolePaths.map(rolePath => db.ref(rolePath).once("value").then(snapshot => ({ rolePath, snapshot })))
      ).then(results => {
        results.forEach(({ rolePath, snapshot }) => {
          snapshot.forEach(child => {
            const data = child.val();
            if ((data.email === identifier || data.phone === identifier) && data.password === password) {
              found = true;

              if (rolePath === "staffs") {
                sessionStorage.setItem("staffName", data.name);
                sessionStorage.setItem("userRole", "staff");
                alert("✅ Welcome, Staff " + data.name);
                window.location.href = "transaction.html";
              } else {
                sessionStorage.setItem("buyerKey", child.key);
                sessionStorage.setItem("buyerName", data.name);
                sessionStorage.setItem("userRole", "member");
                document.getElementById("loginSection").classList.add("hidden");
                document.getElementById("registerSection").classList.add("hidden");
                document.getElementById("changePassPanel").classList.remove("hidden");
                alert("✅ Welcome, " + data.name + "! You can change your password below.");
              }
            }
          });
        });

        if (!found) alert("❌ Invalid credentials.");
      }).catch(err => alert("⚠️ Login error: " + err.message));
    }

    // === Update Password ===
    function updatePassword() {
      const buyerKey = sessionStorage.getItem("buyerKey");
      if (!buyerKey) return alert("⚠️ Session expired. Please login again.");

      const oldP = document.getElementById("oldPass").value.trim();
      const newP = document.getElementById("newPass").value.trim();
      const confirmP = document.getElementById("confirmPass").value.trim();

      db.ref("buyers/" + buyerKey).once("value").then(snap => {
        const data = snap.val();
        if (!data) return alert("❌ Member not found.");

        if (oldP !== data.password) return alert("❌ Old password incorrect!");
        if (newP.length < 4) return alert("⚠️ Password must be at least 4 characters.");
        if (newP !== confirmP) return alert("❌ New passwords do not match.");

        db.ref("buyers/" + buyerKey).update({ password: newP }).then(() => {
          alert("✅ Password updated successfully!");
          document.getElementById("oldPass").value = "";
          document.getElementById("newPass").value = "";
          document.getElementById("confirmPass").value = "";
        });
      });
    }

    // === Logout ===
    function logoutUser() {
      sessionStorage.clear();
      location.reload();
    }
  </script>
</body>
</html>
