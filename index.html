<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kopi Copybara - Loyalty Login</title>
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyAWZg7mZe1j2Nwkg5JvPUjf_bdCvfWvN9g",
      authDomain: "kopi-copybara.firebaseapp.com",
      databaseURL: "https://kopi-copybara-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "kopi-copybara",
      storageBucket: "kopi-copybara.appspot.com",
      messagingSenderId: "729875984861",
      appId: "1:729875984861:web:6b1ea2d44f8789c18e4634"
    };
    firebase.initializeApp(firebaseConfig);
  </script>

  <style>
    body {
      background-color: #fffaf0;
      font-family: 'Poppins', sans-serif;
    }
    .card {
      background: white;
      border-radius: 12px;
      padding: 24px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      max-width: 400px;
      margin: 60px auto;
    }
    button {
      transition: 0.3s;
    }
    button:hover {
      opacity: 0.85;
    }
    #changePasswordSection, #changePasswordBtn {
      display: none;
    }
  </style>
</head>

<body>
  <div class="card">
    <h1 class="text-2xl font-bold text-center text-amber-800 mb-4">
      ☕ Kopi Copybara Loyalty
    </h1>

    <!-- Registration Section -->
    <div id="registerSection">
      <h2 class="text-lg font-semibold mb-2 text-center">New Registration</h2>

      <select id="userType" class="w-full border rounded p-2 mb-3">
        <option value="">-- Select Role --</option>
        <option value="buyer">Member</option>
        <option value="staff">Staff</option>
      </select>

      <input id="regName" class="w-full border rounded p-2 mb-2" placeholder="Full Name" />
      <input id="regPhone" class="w-full border rounded p-2 mb-2" placeholder="Phone Number" />
      <input id="regEmail" type="email" class="w-full border rounded p-2 mb-2" placeholder="Email" />
      <input id="regPassword" type="password" class="w-full border rounded p-2 mb-2" placeholder="Password" />

      <div id="staffMasterDiv" class="hidden">
        <input id="staffMasterPassword" type="password" class="w-full border rounded p-2 mb-2" placeholder="Master Password (for staff)" />
      </div>

      <button onclick="registerUser()" class="w-full bg-amber-700 text-white p-2 rounded-lg mb-4">
        Register
      </button>
    </div>

    <!-- Change Password Button -->
    <button id="changePasswordBtn" onclick="showChangePassword()" class="w-full bg-yellow-600 text-white p-2 rounded-lg mb-4">
      Change Password
    </button>

    <!-- Change Password Section -->
    <div id="changePasswordSection">
      <h2 class="text-lg font-semibold mb-2 text-center">Change Password</h2>
      <input id="changeIdentifier" class="w-full border rounded p-2 mb-2" placeholder="Registered Email or Phone" />
      <input id="currentPassword" type="password" class="w-full border rounded p-2 mb-2" placeholder="Current Password" />
      <input id="newPassword" type="password" class="w-full border rounded p-2 mb-3" placeholder="New Password" />
      <button onclick="updatePassword()" class="w-full bg-green-700 text-white p-2 rounded-lg mb-3">Save New Password</button>
      <button onclick="cancelChangePassword()" class="w-full bg-gray-500 text-white p-2 rounded-lg">Cancel</button>
    </div>

    <hr class="my-4" />

    <!-- Login Section -->
    <div id="loginSection">
      <h2 class="text-lg font-semibold mb-2 text-center">Login</h2>
      <input id="loginIdentifier" class="w-full border rounded p-2 mb-2" placeholder="Email or Phone Number" />
      <input id="loginPassword" type="password" class="w-full border rounded p-2 mb-3" placeholder="Password" />
      <button onclick="loginUser()" class="w-full bg-green-700 text-white p-2 rounded-lg">
        Login
      </button>
    </div>
  </div>

  <script>
    const db = firebase.database();
    const staffMasterDiv = document.getElementById('staffMasterDiv');
    const changePasswordSection = document.getElementById('changePasswordSection');
    const changePasswordBtn = document.getElementById('changePasswordBtn');

    // === Show/Hide Master Password ===
    document.getElementById('userType').addEventListener('change', function() {
      if (this.value === 'staff') staffMasterDiv.classList.remove('hidden');
      else staffMasterDiv.classList.add('hidden');
    });

    // === Register User ===
    function registerUser() {
      const role = document.getElementById("userType").value;
      const name = document.getElementById("regName").value.trim();
      const phone = document.getElementById("regPhone").value.trim();
      const email = document.getElementById("regEmail").value.trim();
      const password = document.getElementById("regPassword").value.trim();

      if (!role || !name || !phone || !email || !password) return alert("Please fill all fields.");

      if (role === "staff") {
        const master = document.getElementById("staffMasterPassword").value.trim();
        if (master !== "230420") return alert("Invalid master password for staff registration!");
      }

      const userKey = email.replace(/[.@]/g, "_");
      const ref = db.ref(role === "staff" ? "staffs/" + userKey : "buyers/" + userKey);

      ref.set({
        name, phone, email, password, role,
        points: role === "buyer" ? 0 : null,
        createdAt: new Date().toISOString()
      }).then(() => {
        alert(`✅ ${role === "staff" ? "Staff" : "Member"} registered successfully!`);
        ["regName","regPhone","regEmail","regPassword","staffMasterPassword"].forEach(id => document.getElementById(id).value="");
        staffMasterDiv.classList.add('hidden');
      });
    }

    // === Change Password UI ===
    function showChangePassword() {
      document.getElementById("registerSection").style.display = "none";
      document.getElementById("loginSection").style.display = "none";
      changePasswordSection.style.display = "block";
    }
    function cancelChangePassword() {
      changePasswordSection.style.display = "none";
      document.getElementById("registerSection").style.display = "block";
      document.getElementById("loginSection").style.display = "block";
    }

    // === Update Password ===
    async function updatePassword() {
      const identifier = document.getElementById("changeIdentifier").value.trim();
      const currentPass = document.getElementById("currentPassword").value.trim();
      const newPass = document.getElementById("newPassword").value.trim();
      if (!identifier || !currentPass || !newPass) return alert("Please fill all fields.");

      const roles = ["buyers", "staffs"];
      let updated = false;

      for (const path of roles) {
        const snapshot = await db.ref(path).once("value");
        snapshot.forEach(child => {
          const data = child.val();
          if ((data.email === identifier || data.phone === identifier) && data.password === currentPass) {
            db.ref(path + "/" + child.key).update({ password: newPass });
            updated = true;
            alert("✅ Password updated successfully!");
          }
        });
        if (updated) break;
      }

      if (!updated) alert("❌ Account not found or current password incorrect.");
      cancelChangePassword();
    }

    // === Login ===
    async function loginUser() {
      const identifier = document.getElementById("loginIdentifier").value.trim();
      const password = document.getElementById("loginPassword").value.trim();
      if (!identifier || !password) return alert("Please fill all fields.");

      const roles = ["buyers", "staffs"];
      let loggedIn = false;

      for (const path of roles) {
        const snapshot = await db.ref(path).once("value");
        snapshot.forEach(child => {
          const data = child.val();
          if ((data.email === identifier || data.phone === identifier) && data.password === password) {
            loggedIn = true;
            sessionStorage.setItem("userName", data.name);
            sessionStorage.setItem("userRole", data.role);
            sessionStorage.setItem("userEmail", data.email);
            sessionStorage.setItem("userPhone", data.phone);

            alert(`✅ Welcome, ${data.role === 'staff' ? 'Staff ' : ''}${data.name}`);

            // Small delay for smooth transition
            setTimeout(() => {
              window.location.href = data.role === "staff" ? "transaction.html" : "redeem.html";
            }, 600);
          }
        });
        if (loggedIn) break;
      }

      if (!loggedIn) alert("❌ Invalid email/phone or password.");
    }

    // === Show Change Password Button if logged in ===
    window.addEventListener("load", () => {
      const userRole = sessionStorage.getItem("userRole");
      if (userRole) {
        changePasswordBtn.style.display = "block";
      }
    });
  </script>
</body>
</html>
