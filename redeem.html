<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kopi Copybara - Redeem Points</title>
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyAWZg7mZe1j2Nwkg5JvPUjf_bdCvfWvN9g",
      authDomain: "kopi-copybara.firebaseapp.com",
      databaseURL: "https://kopi-copybara-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "kopi-copybara",
      storageBucket: "kopi-copybara.appspot.com",
      messagingSenderId: "729875984861",
      appId: "1:729875984861:web:6b1ea2d44f8789c18e4634"
    };
    firebase.initializeApp(firebaseConfig);
  </script>

  <style>
    body {
      background-color: #fffaf0;
      font-family: 'Poppins', sans-serif;
    }
    .card {
      background: white;
      border-radius: 12px;
      padding: 24px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      max-width: 450px;
      margin: 40px auto;
    }
    button {
      transition: 0.3s;
    }
    button:hover {
      opacity: 0.85;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1 class="text-2xl font-bold text-center text-amber-800 mb-4">☕ Kopi Copybara - Redeem Points</h1>

    <div id="welcomeSection" class="text-center mb-4">
      <h2 class="text-lg font-semibold text-amber-900" id="welcomeName"></h2>
      <p class="text-sm text-gray-600">Total Points: <span id="userPoints" class="font-bold text-green-700">0</span></p>
    </div>

    <div class="mb-4">
      <h3 class="text-lg font-semibold text-amber-800 mb-2">Redeemable Items</h3>
      <div id="itemsList" class="space-y-3"></div>
    </div>

    <button onclick="logout()" class="w-full bg-red-600 text-white p-2 rounded-lg mt-4">Logout</button>
  </div>

  <script>
    const db = firebase.database();
    const buyerName = sessionStorage.getItem("buyerName");

    document.addEventListener("DOMContentLoaded", () => {
      if (!buyerName) {
        alert("Session expired. Please login again.");
        window.location.href = "index.html";
        return;
      }

      document.getElementById("welcomeName").textContent = `Welcome, ${buyerName}!`;

      const items = [
        { name: "Copyaren", cost: 10 },
        { name: "Chocobara", cost: 12 },
        { name: "Camericano", cost: 8 }
      ];

      const listDiv = document.getElementById("itemsList");
      items.forEach(item => {
        const div = document.createElement("div");
        div.classList = "border p-3 rounded-lg flex justify-between items-center";
        div.innerHTML = `
          <div>
            <p class="font-semibold">${item.name}</p>
            <p class="text-sm text-gray-600">${item.cost} Points</p>
          </div>
          <button class="bg-green-700 text-white px-3 py-1 rounded-lg" onclick="redeemItem('${item.name}', ${item.cost})">Redeem</button>
        `;
        listDiv.appendChild(div);
      });

      loadUserPoints();
    });

    function loadUserPoints() {
      db.ref("buyers").once("value", snapshot => {
        snapshot.forEach(child => {
          const user = child.val();
          if (user.name === buyerName) {
            document.getElementById("userPoints").textContent = user.points || 0;
          }
        });
      });
    }

    function redeemItem(itemName, cost) {
      const currentPoints = parseInt(document.getElementById("userPoints").textContent);
      if (currentPoints < cost) {
        alert("❌ Not enough points to redeem this item!");
        return;
      }

      const newPoints = currentPoints - cost;
      const userKey = buyerName.toLowerCase().replace(/\s+/g, "_");

      // Update points
      db.ref("buyers").once("value", snapshot => {
        snapshot.forEach(child => {
          const user = child.val();
          if (user.name === buyerName) {
            db.ref("buyers/" + child.key + "/points").set(newPoints);
            db.ref("redemptions/" + Date.now()).set({
              buyer: buyerName,
              item: itemName,
              cost,
              date: new Date().toISOString()
            });
            alert(`🎁 You have redeemed ${itemName} for ${cost} points!`);
            document.getElementById("userPoints").textContent = newPoints;
          }
        });
      });
    }

    function logout() {
      sessionStorage.clear();
      window.location.href = "index.html";
    }
  </script>
</body>
</html>
