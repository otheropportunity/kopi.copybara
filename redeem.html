<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🎁 Redeem Points - Kopi Copybara</title>
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyAWZg7mZe1j2Nwkg5JvPUjf_bdCvfWvN9g",
      authDomain: "kopi-copybara.firebaseapp.com",
      databaseURL: "https://kopi-copybara-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "kopi-copybara",
      storageBucket: "kopi-copybara.appspot.com",
      messagingSenderId: "729875984861",
      appId: "1:729875984861:web:6b1ea2d44f8789c18e4634"
    };
    firebase.initializeApp(firebaseConfig);
  </script>

  <style>
    body {
      background-color: #fffaf0;
      font-family: 'Poppins', sans-serif;
    }
    .card {
      background: white;
      border-radius: 12px;
      padding: 24px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      max-width: 420px;
      margin: 40px auto;
    }
    button {
      transition: 0.3s;
    }
    button:hover {
      opacity: 0.9;
    }
  </style>
</head>

<body>
  <div class="card">
    <h1 class="text-2xl font-bold text-center text-amber-800 mb-4">🎁 Redeem Points</h1>

    <!-- 👤 Member Summary -->
    <div class="border border-amber-400 bg-amber-50 rounded-lg p-3 mb-4 text-center">
      <h2 class="font-semibold text-lg text-amber-900 flex items-center justify-center gap-2">
        👤 Member Summary
      </h2>
      <p id="buyerName" class="font-semibold text-gray-700 mt-1">Name: -</p>
      <p id="totalPoints" class="text-gray-700 mt-1">Total Points: 0</p>

      <div class="grid grid-cols-2 text-sm mt-2 text-gray-700">
        <div>Glass: <span id="ptsGlass">0</span></div>
        <div>Pocket: <span id="ptsPocket">0</span></div>
        <div>500ml: <span id="pts500ml">0</span></div>
        <div>1L: <span id="pts1L">0</span></div>
      </div>
    </div>

    <!-- 🎯 Redeem Section -->
    <div class="space-y-2">
      <label class="font-semibold text-gray-800 text-sm">Select Item to Redeem:</label>
      <select id="redeemProduct" class="w-full border rounded p-2 mb-2">
        <option value="">-- Select Product --</option>
        <option value="copyaren">Copyaren</option>
        <option value="chocobara">Chocobara</option>
        <option value="camericano">Camericano</option>
      </select>

      <label class="font-semibold text-gray-800 text-sm">Select Size:</label>
      <select id="redeemSize" class="w-full border rounded p-2 mb-2">
        <option value="">-- Select Size --</option>
        <option value="175">Glass (175ml)</option>
        <option value="250">Pocket (250ml)</option>
        <option value="500">500ml</option>
        <option value="1000">1L</option>
      </select>

      <label class="font-semibold text-gray-800 text-sm">Use Point Type:</label>
      <select id="pointType" class="w-full border rounded p-2 mb-2">
        <option value="">-- Select Point Type --</option>
        <option value="summaryGlass">Glass Point</option>
        <option value="summaryPocket">Pocket Point</option>
        <option value="summary500ml">500ml Point</option>
        <option value="summary1L">1L Point</option>
      </select>

      <button onclick="redeemPoints()" class="w-full bg-green-700 text-white font-semibold p-2 rounded-lg mt-3">
        🎯 Redeem
      </button>

      <!-- Staff-only -->
      <button id="backToTransactionBtn" onclick="window.location.href='transaction.html'" class="w-full bg-gray-400 text-white font-semibold p-2 rounded-lg mt-2">
        ⬅️ Back to Transaction
      </button>

      <button onclick="logoutUser()" class="w-full bg-red-600 text-white font-semibold p-2 rounded-lg mt-2">
        🚪 Logout
      </button>
    </div>
  </div>

  <script>
    const db = firebase.database();
    const buyerName = document.getElementById("buyerName");
    const totalPoints = document.getElementById("totalPoints");
    const backBtn = document.getElementById("backToTransactionBtn");

    window.onload = () => {
      const buyerData = JSON.parse(localStorage.getItem("buyerInfo"));
      const userRole = sessionStorage.getItem("userRole");

      if (!buyerData) {
        alert("⚠️ Buyer information missing. Please go back to transaction page.");
        window.location.href = "transaction.html";
        return;
      }

      // Hide Back button for members
      if (userRole !== "staff") backBtn.style.display = "none";

      buyerName.textContent = "Name: " + buyerData.name;

      // Load buyer info from Firebase
      db.ref("buyers/" + buyerData.id).once("value").then(snapshot => {
        const data = snapshot.val();
        if (data) {
          document.getElementById("totalPoints").textContent = "Total Points: " + (data.masterPoints || 0);
          document.getElementById("ptsGlass").textContent = data.summaryGlass || 0;
          document.getElementById("ptsPocket").textContent = data.summaryPocket || 0;
          document.getElementById("pts500ml").textContent = data.summary500ml || 0;
          document.getElementById("pts1L").textContent = data.summary1L || 0;
        }
      });
    };

    function redeemPoints() {
      const product = document.getElementById("redeemProduct").value;
      const size = document.getElementById("redeemSize").value;
      const pointType = document.getElementById("pointType").value;

      if (!product || !size || !pointType) {
        alert("⚠️ Please complete all fields before redeeming.");
        return;
      }

      const buyerData = JSON.parse(localStorage.getItem("buyerInfo"));
      db.ref("buyers/" + buyerData.id).once("value").then(snapshot => {
        const data = snapshot.val() || {};
        const currentPoints = data[pointType] || 0;

        if (currentPoints <= 0) {
          alert("❌ Not enough points to redeem this item!");
          return;
        }

        // Deduct 1 point (you can adjust logic)
        const updatedPoints = { [pointType]: currentPoints - 1, masterPoints: (data.masterPoints || 0) - 1 };

        db.ref("buyers/" + buyerData.id).update(updatedPoints).then(() => {
          alert(`🎁 Successfully redeemed ${product} (${size}) using ${pointType.replace("summary", "")} points!`);
          location.reload();
        });
      });
    }

    function logoutUser() {
      sessionStorage.clear();
      localStorage.removeItem("buyerInfo");
      window.location.href = "index.html";
    }
  </script>
</body>
</html>
