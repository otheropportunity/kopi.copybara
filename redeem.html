<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kopi Copybara - Redeem Points</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyAWZg7mZe1j2Nwkg5JvPUjf_bdCvfWvN9g",
      authDomain: "kopi-copybara.firebaseapp.com",
      databaseURL: "https://kopi-copybara-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "kopi-copybara",
      storageBucket: "kopi-copybara.appspot.com",
      messagingSenderId: "729875984861",
      appId: "1:729875984861:web:6b1ea2d44f8789c18e4634"
    };
    firebase.initializeApp(firebaseConfig);
  </script>

  <style>
    body { background-color: #fffaf0; font-family: 'Poppins', sans-serif; }
    .card { background: white; border-radius: 12px; padding: 24px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); max-width: 450px; margin: 40px auto; }
    .hidden { display: none; }
  </style>
</head>
<body>
  <div class="card">
    <h1 class="text-2xl font-bold text-center text-amber-800 mb-4">🎁 Redeem Points</h1>

    <div class="text-center mb-4">
      <h2 id="welcomeName" class="text-lg font-semibold text-amber-900"></h2>
      <p>Total Points: <span id="userPoints" class="font-bold text-green-700">0</span></p>
    </div>

    <div class="mb-4">
      <h3 class="font-semibold text-amber-800 mb-2">Select Items</h3>

      <!-- Copyaren -->
      <div class="mb-2">
        <label>Copyaren</label>
        <div class="flex gap-2 mb-1">
          <input type="number" id="copyarenQty" min="0" value="0" class="w-16 border text-center rounded">
          <select id="copyarenSize" class="flex-grow border rounded p-1">
            <option value="10">Glass 175ml (10 pts)</option>
            <option value="20">Pocket 250ml (20 pts)</option>
            <option value="40">500ml (40 pts)</option>
            <option value="80">1L (80 pts)</option>
          </select>
        </div>
      </div>

      <!-- Chocobara -->
      <div class="mb-2">
        <label>Chocobara</label>
        <div class="flex gap-2 mb-1">
          <input type="number" id="chocobaraQty" min="0" value="0" class="w-16 border text-center rounded">
          <select id="chocobaraSize" class="flex-grow border rounded p-1">
            <option value="12">Glass 175ml (12 pts)</option>
            <option value="24">Pocket 250ml (24 pts)</option>
            <option value="48">500ml (48 pts)</option>
            <option value="95">1L (95 pts)</option>
          </select>
        </div>
      </div>

      <!-- Camericano -->
      <div class="mb-2">
        <label>Camericano</label>
        <div class="flex gap-2 mb-1">
          <input type="number" id="camericanoQty" min="0" value="0" class="w-16 border text-center rounded">
          <select id="camericanoSize" class="flex-grow border rounded p-1">
            <option value="8">Glass 175ml (8 pts)</option>
            <option value="15">Pocket 250ml (15 pts)</option>
            <option value="30">500ml (30 pts)</option>
            <option value="60">1L (60 pts)</option>
          </select>
        </div>
      </div>
    </div>

    <button onclick="showSummary()" class="w-full bg-green-700 text-white p-2 rounded mb-3">Redeem Selected</button>
    <button onclick="backToTransaction()" class="w-full bg-gray-400 text-white p-2 rounded">← Back</button>
  </div>

  <!-- Summary Modal -->
  <div id="summaryModal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex justify-center items-center">
    <div class="bg-white rounded p-6 w-80">
      <h3 class="text-lg font-bold text-amber-800 mb-2 text-center">Confirm Redemption</h3>
      <div id="summaryList" class="text-sm mb-3"></div>
      <p class="text-center">Total Points: <span id="summaryTotal" class="font-bold text-green-700"></span></p>
      <div class="flex gap-2 mt-4">
        <button onclick="cancelSummary()" class="flex-1 bg-gray-300 p-2 rounded">Cancel</button>
        <button onclick="askConfirmation()" class="flex-1 bg-green-700 text-white p-2 rounded">Next</button>
      </div>
    </div>
  </div>

  <!-- Password Confirmation Modal -->
  <div id="passwordModal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex justify-center items-center">
    <div class="bg-white rounded p-6 w-80">
      <h3 class="text-lg font-bold text-center text-amber-800 mb-3">🔐 Authorization Required</h3>
      <p class="text-sm text-center mb-2">Enter Staff Master Password and Member Password to confirm.</p>
      <input type="password" id="staffPassword" placeholder="Staff Master Password" class="w-full border p-2 rounded mb-2">
      <input type="password" id="memberPassword" placeholder="Member Password" class="w-full border p-2 rounded mb-4">
      <div class="flex gap-2">
        <button onclick="cancelPassword()" class="flex-1 bg-gray-300 p-2 rounded">Cancel</button>
        <button onclick="confirmRedemption()" class="flex-1 bg-green-700 text-white p-2 rounded">Confirm</button>
      </div>
    </div>
  </div>

  <script>
    const db = firebase.database();
    const STAFF_MASTER_PASSWORD = "230420";
    let buyerId = null;
    let buyerName = "";
    let buyerPoints = 0;
    let buyerPassword = "";

    document.addEventListener("DOMContentLoaded", () => {
      // use sessionStorage values set by transaction.html
      buyerId = sessionStorage.getItem("currentBuyerId");
      buyerName = sessionStorage.getItem("currentBuyerName");

      // If session missing, go back to transaction page
      if (!buyerId) {
        alert("Session expired. Returning to transaction page.");
        window.location.href = "transaction.html";
        return;
      }

      // Display name immediately from session (keeps UI responsive)
      if (buyerName) {
        document.getElementById("welcomeName").textContent = `Welcome, ${buyerName}!`;
      }

      // Load buyer data (points + password) from database (single source of truth)
      db.ref("buyers/" + buyerId).once("value").then(snap => {
        if (snap.exists()) {
          const data = snap.val();
          // Use stored name if session didn't have it
          if (!buyerName && data.name) buyerName = data.name;
          buyerPoints = Number(data.points || 0);
          buyerPassword = data.password || "";
          document.getElementById("welcomeName").textContent = `Welcome, ${buyerName}!`;
          document.getElementById("userPoints").textContent = buyerPoints;
          // keep sessionStorage in sync
          sessionStorage.setItem("currentBuyerName", buyerName);
          sessionStorage.setItem("currentBuyerPoints", buyerPoints);
        } else {
          // If buyers/<id> doesn't exist (unlikely), initialize points = 0
          db.ref("buyers/" + buyerId).set({ name: buyerName || "Unknown", points: 0 }).then(() => {
            buyerPoints = 0;
            document.getElementById("userPoints").textContent = 0;
            sessionStorage.setItem("currentBuyerPoints", 0);
          });
        }
      }).catch(err => {
        console.error("Error loading buyer:", err);
        alert("Failed to load buyer data.");
      });
    });

    function parseIntSafe(v) {
      return Math.max(0, parseInt(v || 0, 10) || 0);
    }

    function calculateTotalPoints() {
      // parse values explicitly
      const cQty = parseIntSafe(document.getElementById("copyarenQty").value);
      const cSize = parseIntSafe(document.getElementById("copyarenSize").value);
      const bQty = parseIntSafe(document.getElementById("chocobaraQty").value);
      const bSize = parseIntSafe(document.getElementById("chocobaraSize").value);
      const aQty = parseIntSafe(document.getElementById("camericanoQty").value);
      const aSize = parseIntSafe(document.getElementById("camericanoSize").value);
      return cQty * cSize + bQty * bSize + aQty * aSize;
    }

    function showSummary() {
      const totalCost = calculateTotalPoints();
      if (totalCost <= 0) return alert("Select at least one item to redeem.");

      const items = [];
      const add = (qtyId, sizeId, label) => {
        const qty = parseIntSafe(document.getElementById(qtyId).value);
        if (qty > 0) {
          const sizeEl = document.getElementById(sizeId);
          const sizeText = sizeEl.options[sizeEl.selectedIndex].text;
          items.push({ name: label, sizeText, qty });
        }
      };
      add("copyarenQty", "copyarenSize", "Copyaren");
      add("chocobaraQty", "chocobaraSize", "Chocobara");
      add("camericanoQty", "camericanoSize", "Camericano");

      sessionStorage.setItem("redeemItems", JSON.stringify(items));
      sessionStorage.setItem("redeemTotal", String(totalCost));

      document.getElementById("summaryList").innerHTML = items.map(i => `<li>${i.name} - ${i.sizeText} × ${i.qty}</li>`).join("");
      document.getElementById("summaryTotal").textContent = totalCost; // numeric
      document.getElementById("summaryModal").classList.remove("hidden");
    }

    function cancelSummary() {
      document.getElementById("summaryModal").classList.add("hidden");
    }

    function askConfirmation() {
      document.getElementById("summaryModal").classList.add("hidden");
      const totalCost = parseInt(sessionStorage.getItem("redeemTotal") || "0", 10);
      const msg = `You want to redeem ${totalCost} points.\nYour total points: ${buyerPoints}.\nAre you sure?`;
      if (confirm(msg)) {
        document.getElementById("passwordModal").classList.remove("hidden");
      }
    }

    function cancelPassword() {
      document.getElementById("passwordModal").classList.add("hidden");
    }

    function resetRedeemForm() {
      // reset quantities and selects to default
      document.getElementById("copyarenQty").value = 0;
      document.getElementById("copyarenSize").selectedIndex = 0;
      document.getElementById("chocobaraQty").value = 0;
      document.getElementById("chocobaraSize").selectedIndex = 0;
      document.getElementById("camericanoQty").value = 0;
      document.getElementById("camericanoSize").selectedIndex = 0;
      // clear session storage for redeem
      sessionStorage.removeItem("redeemItems");
      sessionStorage.removeItem("redeemTotal");
      // clear password fields
      document.getElementById("staffPassword").value = "";
      document.getElementById("memberPassword").value = "";
    }

    function confirmRedemption() {
      const staffPass = document.getElementById("staffPassword").value.trim();
      const memberPass = document.getElementById("memberPassword").value.trim();
      const totalCost = parseInt(sessionStorage.getItem("redeemTotal") || "0", 10);

      if (staffPass !== STAFF_MASTER_PASSWORD) {
        alert("❌ Incorrect staff master password!");
        return;
      }

      if (memberPass !== buyerPassword) {
        alert("❌ Incorrect member password!");
        return;
      }

      if (totalCost <= 0) {
        alert("No redeem selected.");
        return;
      }

      // Prevent race: read buyer points from DB again to ensure fresh value
      const buyerRef = db.ref("buyers/" + buyerId);
      buyerRef.once("value").then(snap => {
        const dbData = snap.val() || {};
        const dbPoints = Number(dbData.points || 0);

        if (dbPoints < totalCost) {
          alert("❌ Not enough points (another update happened). Please reload.");
          document.getElementById("passwordModal").classList.add("hidden");
          return;
        }

        const newPoints = dbPoints - totalCost;

        // Prepare items and names
        const items = JSON.parse(sessionStorage.getItem("redeemItems") || "[]");
        const itemNames = items.map(i => `${i.name} - ${i.sizeText} × ${i.qty}`).join(", ");
        const staffName = sessionStorage.getItem("staffName") || "Unknown";
        const now = new Date().toLocaleString("en-GB");

        // Update buyer points (single source of truth)
        buyerRef.update({ points: newPoints }).then(() => {
          // Create redemption record
          const redemption = {
            buyerId,
            buyerName,
            dateTime: now,
            totalPointsUsed: totalCost,
            itemName: itemNames,
            staff: staffName,
            remainingPoints: newPoints,
            type: "Redeem"
          };
          const redRef = db.ref("redemptions").push();
          redRef.set(redemption);

          // Create a single transaction row (with remainingPoints)
          const tx = {
            buyerId,
            buyerName,
            totalPointsUsed: totalCost,
            totalAmount: 0,
            totalPointsEarned: 0,
            items: itemNames,
            paymentType: "REDEEM",
            remainingPoints: newPoints,
            staff: staffName,
            dateTime: now
          };
          db.ref("transactions").push(tx).then(() => {
            // update UI and local session storage
            buyerPoints = newPoints;
            document.getElementById("userPoints").textContent = buyerPoints;
            sessionStorage.setItem("currentBuyerPoints", buyerPoints);

            // reset form and hide modal
            resetRedeemForm();
            document.getElementById("passwordModal").classList.add("hidden");
            alert(`✅ Redemption successful! Remaining points: ${newPoints}`);
          }).catch(err => {
            console.error("Failed to push transaction:", err);
            alert("Redemption recorded but failed to write transaction. Check console.");
          });
        }).catch(err => {
          console.error("Failed to update buyer points:", err);
          alert("Failed to update points. Try again.");
        });
      }).catch(err => {
        console.error("Failed to read buyer data:", err);
        alert("Failed to verify buyer points. Try again.");
      });
    }

    function backToTransaction() {
      window.location.href = "transaction.html";
    }
  </script>
</body>
</html>
