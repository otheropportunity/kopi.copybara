<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Coffee Loyalty - Redeem Points</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
  <style>
    body { background-color: #fffaf0; font-family: 'Poppins', sans-serif; }
    .card { background: white; border-radius: 12px; padding: 24px; max-width: 600px; margin: 50px auto; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
    select, input[type="number"], input[type="text"] { border: 1px solid #ccc; border-radius: 6px; padding: 6px; }
  </style>
</head>
<body>
<div class="card">
  <h1 class="text-2xl font-bold text-center text-amber-800 mb-2">☕ Redeem Points</h1>
  <h2 class="text-lg font-semibold text-center mb-4">Staff: <span id="staffNameDisplay" class="text-amber-700"></span></h2>

  <!-- Search Buyer -->
  <div class="mb-4">
    <input id="searchBuyer" class="w-full border rounded p-2 mb-2" placeholder="Search Buyer (Name / Phone)" />
    <button onclick="searchBuyer()" class="w-full bg-green-700 text-white p-2 rounded-lg hover:bg-green-800 transition">Search Buyer</button>
  </div>

  <!-- Buyer Info -->
  <div id="buyerInfo" class="hidden border-t pt-3">
    <p><strong>Name:</strong> <span id="buyerFoundName"></span></p>
    <p><strong>Points Available:</strong> <span id="buyerFoundPoints"></span></p>

    <h3 class="font-semibold mb-2 text-amber-800 mt-4">Select Reward Items:</h3>

    <div id="rewardItemsContainer">
      <!-- Reward item template -->
      <div class="mb-3 rewardItemRow">
        <label class="block mb-1">Reward Item:</label>
        <select class="w-full p-2 border rounded rewardItemSelect">
          <option value="Copyaren - 500ml" data-points="40">Copyaren - 500ml (40 pts)</option>
          <option value="Chocobara - Glass 175ml" data-points="12">Chocobara - Glass 175ml (12 pts)</option>
          <option value="Camericano - Glass 175ml" data-points="8">Camericano - Glass 175ml (8 pts)</option>
        </select>
        <label class="block mb-1 mt-2">Quantity:</label>
        <input type="number" class="w-full p-2 border rounded rewardQty" min="1" value="1" />
      </div>
    </div>

    <button onclick="addRewardItem()" class="w-full bg-green-600 text-white p-2 rounded-lg mt-2 hover:bg-green-700">➕ Add Another Item</button>
    <button onclick="submitRedeem()" class="w-full bg-amber-700 text-white p-2 rounded-lg mt-3 hover:bg-amber-800">Redeem All Items</button>
  </div>

  <div class="mt-6 space-y-3">
    <button onclick="window.location.href='transaction.html'" class="w-full bg-yellow-600 text-white p-2 rounded-lg hover:bg-yellow-700">Go to Transaction</button>
    <button onclick="window.location.href='history.html'" class="w-full bg-yellow-600 text-white p-2 rounded-lg hover:bg-yellow-700">View History</button>
    <button onclick="logoutStaff()" class="w-full bg-gray-300 text-gray-800 p-2 rounded-lg hover:bg-gray-400">Logout</button>
  </div>
</div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyAWZg7mZe1j2Nwkg5JvPUjf_bdCvfWvN9g",
  authDomain: "kopi-copybara.firebaseapp.com",
  databaseURL: "https://kopi-copybara-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "kopi-copybara",
  storageBucket: "kopi-copybara.appspot.com",
  messagingSenderId: "729875984861",
  appId: "1:729875984861:web:6b1ea2d44f8789c18e4634"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

let currentBuyerId = null;
let currentBuyerName = "";
let currentBuyerPoints = 0;

document.addEventListener("DOMContentLoaded", () => {
  const staffName = sessionStorage.getItem("staffName") || "Unknown";
  document.getElementById("staffNameDisplay").textContent = staffName;
});

// Add another reward item row
function addRewardItem() {
  const container = document.getElementById("rewardItemsContainer");
  const newRow = container.firstElementChild.cloneNode(true);
  newRow.querySelector(".rewardQty").value = 1;
  container.appendChild(newRow);
}

// Search Buyer
function searchBuyer() {
  const query = document.getElementById("searchBuyer").value.trim().toLowerCase();
  if (!query) return alert("Enter buyer name or phone!");

  db.ref("buyers").once("value").then(snapshot => {
    let found = false;
    snapshot.forEach(child => {
      const data = child.val();
      if ((data.name && data.name.toLowerCase().includes(query)) ||
          (data.phone && data.phone.includes(query))) {
        found = true;
        currentBuyerId = child.key;
        currentBuyerName = data.name;
        currentBuyerPoints = data.points || 0;

        document.getElementById("buyerFoundName").innerText = currentBuyerName;
        document.getElementById("buyerFoundPoints").innerText = currentBuyerPoints;
        document.getElementById("buyerInfo").classList.remove("hidden");
      }
    });
    if (!found) alert("Buyer not found!");
  });
}

// Submit Redeem
function submitRedeem() {
  if (!currentBuyerId) return alert("Search for a buyer first!");

  // Collect all items and total points
  const rewardRows = document.querySelectorAll(".rewardItemRow");
  let totalPointsNeeded = 0;
  const redeemItems = [];

  rewardRows.forEach(row => {
    const itemSelect = row.querySelector(".rewardItemSelect");
    const qtyInput = row.querySelector(".rewardQty");
    const qty = parseInt(qtyInput.value) || 0;
    if (qty <= 0) return;
    const pointsPerItem = parseInt(itemSelect.selectedOptions[0].dataset.points);
    totalPointsNeeded += pointsPerItem * qty;
    redeemItems.push({ name: itemSelect.value, qty, pointsPerItem });
  });

  if (totalPointsNeeded === 0) return alert("Please select at least one item with quantity!");
  if (currentBuyerPoints < totalPointsNeeded) return alert(`Not enough points! Buyer has ${currentBuyerPoints} pts.`);

  if (!confirm(`Confirm redeem of ${redeemItems.length} item(s) for ${totalPointsNeeded} points?`)) return;

  const now = new Date().toLocaleString("en-GB");
  const staffName = sessionStorage.getItem("staffName") || "Unknown";

  // Redemption lock
  const lockRef = db.ref("system/redemptionLock");
  lockRef.transaction(lock => lock ? lock : true).then(result => {
    if (!result.committed) return alert("❌ Another redemption is in progress. Try again later.");

    // Deduct points
    const memberRef = db.ref("members/" + currentBuyerName);
    memberRef.transaction(member => {
      if (member) {
        if ((member.points || 0) < totalPointsNeeded) return;
        member.points -= totalPointsNeeded;
      }
      return member;
    }).then(result => {
      if (!result.committed) {
        lockRef.set(false);
        return alert("Transaction failed. Try again.");
      }

      // Record each redemption
      const updates = {};
      redeemItems.forEach(item => {
        const key = db.ref("redemptions").push().key;
        updates[key] = {
          buyerId: currentBuyerId,
          buyerName: currentBuyerName,
          itemName: item.name,
          qty: item.qty,
          pointsUsed: item.pointsPerItem * item.qty,
          staff: staffName,
          dateTime: now,
          completed: true
        };
      });

      db.ref("redemptions").update(updates).then(() => {
        lockRef.set(false);
        alert("✅ Redemption successful!");
        window.location.reload();
      });
    });
  });
}

function logoutStaff() {
  sessionStorage.clear();
  window.location.href = "index.html";
}
</script>
</body>
</html>
