<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kopi Copybara - Redeem Points</title>
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyAWZg7mZe1j2Nwkg5JvPUjf_bdCvfWvN9g",
      authDomain: "kopi-copybara.firebaseapp.com",
      databaseURL: "https://kopi-copybara-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "kopi-copybara",
      storageBucket: "kopi-copybara.appspot.com",
      messagingSenderId: "729875984861",
      appId: "1:729875984861:web:6b1ea2d44f8789c18e4634"
    };
    firebase.initializeApp(firebaseConfig);
  </script>

  <style>
    body {
      background-color: #fffaf0;
      font-family: 'Poppins', sans-serif;
    }
    .card {
      background: white;
      border-radius: 12px;
      padding: 24px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      max-width: 450px;
      margin: 40px auto;
    }
    button {
      transition: 0.3s;
    }
    button:hover {
      opacity: 0.85;
    }
    .hidden {
      display: none;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1 class="text-2xl font-bold text-center text-amber-800 mb-4">☕ Kopi Copybara - Redeem Points</h1>

    <div id="welcomeSection" class="text-center mb-4">
      <h2 class="text-lg font-semibold text-amber-900" id="welcomeName"></h2>
      <p class="text-sm text-gray-600">
        Total Points: <span id="userPoints" class="font-bold text-green-700">0</span>
      </p>
    </div>

    <div class="mb-4">
      <h3 class="text-lg font-semibold text-amber-800 mb-2">Redeemable Items</h3>
      <div id="itemsList" class="space-y-3"></div>
    </div>

    <div class="flex flex-col gap-2">
      <button onclick="backToTransaction()" class="w-full bg-gray-400 text-white p-2 rounded-lg">← Back to Transaction</button>
      <button onclick="logout()" class="w-full bg-red-600 text-white p-2 rounded-lg">Logout</button>
    </div>
  </div>

  <!-- Staff Verification Modal -->
  <div id="staffModal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex justify-center items-center">
    <div class="bg-white rounded-lg p-6 w-80 shadow-lg">
      <h3 class="text-lg font-semibold text-amber-800 mb-3 text-center">Staff Verification</h3>
      <p class="text-sm text-gray-600 mb-2 text-center">
        Please ask staff to enter the master password to confirm this redemption.
      </p>
      <input id="staffCodeInput" type="password" placeholder="Enter Staff Master Code"
        class="w-full border rounded p-2 mb-4 text-center" />
      <div class="flex justify-between gap-3">
        <button onclick="cancelStaffVerify()" class="w-1/2 bg-gray-300 text-gray-800 p-2 rounded-lg">Cancel</button>
        <button onclick="confirmStaffCode()" class="w-1/2 bg-green-700 text-white p-2 rounded-lg">Confirm</button>
      </div>
    </div>
  </div>

  <script>
    const db = firebase.database();
    let buyerId = null;
    let buyerName = null;
    let buyerPoints = 0;
    let selectedItem = null;

    document.addEventListener("DOMContentLoaded", () => {
      // ✅ Load session
      buyerId = sessionStorage.getItem("currentBuyerId");
      buyerName = sessionStorage.getItem("currentBuyerName");
      buyerPoints = parseInt(sessionStorage.getItem("currentBuyerPoints")) || 0;

      if (!buyerId || !buyerName) {
        alert("Session expired. Please go back to transaction page.");
        window.location.href = "transaction.html";
        return;
      }

      document.getElementById("welcomeName").textContent = `Welcome, ${buyerName}!`;
      document.getElementById("userPoints").textContent = buyerPoints;

      const items = [
        { name: "Copyaren", cost: 10 },
        { name: "Chocobara", cost: 12 },
        { name: "Camericano", cost: 8 }
      ];

      const listDiv = document.getElementById("itemsList");
      listDiv.innerHTML = "";
      items.forEach(item => {
        const div = document.createElement("div");
        div.classList = "border p-3 rounded-lg flex justify-between items-center";
        div.innerHTML = `
          <div>
            <p class="font-semibold">${item.name}</p>
            <p class="text-sm text-gray-600">${item.cost} Points</p>
          </div>
          <button class="bg-green-700 text-white px-3 py-1 rounded-lg"
            onclick="openStaffModal('${item.name}', ${item.cost})">Redeem</button>
        `;
        listDiv.appendChild(div);
      });
    });

    // ✅ Open staff modal before redeem
    function openStaffModal(itemName, cost) {
      selectedItem = { itemName, cost };
      document.getElementById("staffModal").classList.remove("hidden");
    }

    function cancelStaffVerify() {
      selectedItem = null;
      document.getElementById("staffModal").classList.add("hidden");
      document.getElementById("staffCodeInput").value = "";
    }

    function confirmStaffCode() {
      const code = document.getElementById("staffCodeInput").value.trim();
      if (code !== "230420") {
        alert("❌ Invalid staff master password. Please ask staff to assist.");
        return;
      }
      document.getElementById("staffModal").classList.add("hidden");
      redeemItem(selectedItem.itemName, selectedItem.cost);
    }

    // ✅ Redeem process
    function redeemItem(itemName, cost) {
      if (buyerPoints < cost) {
        alert("❌ Not enough points to redeem this item!");
        return;
      }

      const newPoints = buyerPoints - cost;

      db.ref("buyers/" + buyerId).update({ points: newPoints })
        .then(() => {
          db.ref("redemptions/" + Date.now()).set({
            buyerId,
            buyer: buyerName,
            item: itemName,
            cost,
            date: new Date().toISOString()
          });

          buyerPoints = newPoints;
          sessionStorage.setItem("currentBuyerPoints", newPoints);
          document.getElementById("userPoints").textContent = newPoints;

          alert(`🎁 Redemption successful! ${buyerName} redeemed ${itemName} for ${cost} points.`);
        })
        .catch(err => alert("Error updating points: " + err.message));
    }

    // ✅ Back to transaction
    function backToTransaction() {
      window.location.href = "transaction.html";
    }

    // ✅ Logout all
    function logout() {
      sessionStorage.clear();
      window.location.href = "index.html";
    }
  </script>
</body>
</html>
