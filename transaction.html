<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Transaction - Coffee Loyalty</title>
  <script src="https://www.gstatic.com/firebasejs/10.12.3/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.3/firebase-database-compat.js"></script>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet" />
</head>
<body class="bg-yellow-50 min-h-screen flex flex-col items-center py-6">

  <div class="text-center mb-4">
    <h2 class="text-2xl font-bold text-yellow-800">☕ Coffee Loyalty Transaction</h2>
    <p class="text-gray-500 text-sm">Record customer purchase and update transaction database</p>
    <p id="currentTime" class="text-yellow-700 font-semibold mt-1"></p>
  </div>

  <div class="bg-white shadow-md rounded-2xl p-6 w-full max-w-3xl">
    <div class="grid grid-cols-2 gap-3 mb-4">
      <div>
        <label class="font-semibold text-gray-700">Buyer ID:</label>
        <input id="buyerId" class="border rounded-md w-full p-2" readonly />
      </div>
      <div>
        <label class="font-semibold text-gray-700">Buyer Name:</label>
        <input id="buyerName" class="border rounded-md w-full p-2" readonly />
      </div>
      <div>
        <label class="font-semibold text-gray-700">Staff:</label>
        <input id="staff" class="border rounded-md w-full p-2" placeholder="Enter staff name" />
      </div>
      <div>
        <label class="font-semibold text-gray-700">Payment Type:</label>
        <select id="paymentType" class="border rounded-md w-full p-2">
          <option value="Cash">Cash</option>
          <option value="QRIS">QRIS</option>
          <option value="Card">Card</option>
        </select>
      </div>
    </div>

    <h3 class="text-lg font-semibold text-yellow-700 mb-2">🧾 Purchased Items</h3>
    <div id="itemList" class="space-y-2"></div>

    <button id="addItemBtn" class="bg-green-500 hover:bg-green-600 text-white px-3 py-1 rounded-md mt-2">+ Add Item</button>

    <div class="mt-4 grid grid-cols-2 gap-3">
      <div>
        <label class="font-semibold text-gray-700">Total Amount:</label>
        <input id="totalAmount" class="border rounded-md w-full p-2" readonly />
      </div>
      <div>
        <label class="font-semibold text-gray-700">Total Points Earned:</label>
        <input id="totalPointsEarned" class="border rounded-md w-full p-2" readonly />
      </div>
      <div>
        <label class="font-semibold text-gray-700">Customer Paid:</label>
        <input id="paidAmount" type="number" class="border rounded-md w-full p-2" placeholder="Enter paid amount" />
      </div>
      <div>
        <label class="font-semibold text-gray-700">Change Amount:</label>
        <input id="changeAmount" class="border rounded-md w-full p-2" readonly />
      </div>
    </div>

    <button id="submitTransactionBtn" class="mt-5 bg-yellow-500 hover:bg-yellow-600 text-white font-semibold py-2 px-4 rounded-xl w-full">💾 Submit Transaction</button>

    <div class="text-center mt-5">
      <button onclick="window.location.href='history.html'" class="bg-blue-500 hover:bg-blue-600 text-white py-2 px-4 rounded-xl">
        📜 View History
      </button>
    </div>
  </div>

  <script>
    // 🔧 Firebase Setup
    const firebaseConfig = {
      apiKey: "AIzaSyAWZg7mZe1j2Nwkg5JvPUjf_bdCvfWvN9g",
      authDomain: "kopi-copybara.firebaseapp.com",
      databaseURL: "https://kopi-copybara-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "kopi-copybara",
      storageBucket: "kopi-copybara.appspot.com",
      messagingSenderId: "729875984861",
      appId: "1:729875984861:web:6b1ea2d44f8789c18e4634"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    // 🕒 Real-time clock
    setInterval(() => {
      const now = new Date();
      document.getElementById("currentTime").innerText = now.toLocaleString();
    }, 1000);

    // 🧠 Load buyer info
    const buyerInfo = JSON.parse(localStorage.getItem("buyerInfo")) || {};
    document.getElementById("buyerId").value = buyerInfo.id || sessionStorage.getItem("buyerId") || "Unknown";
    document.getElementById("buyerName").value = buyerInfo.name || sessionStorage.getItem("buyerName") || "Unknown";

    const itemListDiv = document.getElementById("itemList");
    let itemCount = 0;

    document.getElementById("addItemBtn").onclick = () => {
      itemCount++;
      const div = document.createElement("div");
      div.classList.add("flex", "items-center", "space-x-2");
      div.innerHTML = `
        <input placeholder="Item name" class="border rounded-md p-1 w-2/5 itemName" />
        <select class="border rounded-md p-1 size w-1/5">
          <option value="Glass">Glass</option>
          <option value="Pocket">Pocket</option>
          <option value="500ml">500ml</option>
          <option value="1L">1L</option>
        </select>
        <input type="number" class="border rounded-md p-1 w-1/5 qty" placeholder="Qty" min="1" value="1" />
        <input type="number" class="border rounded-md p-1 w-1/5 price" placeholder="Price" />
        <button class="text-red-500 font-bold" onclick="this.parentElement.remove()">✖</button>
      `;
      itemListDiv.appendChild(div);
    };

    // 🔢 Calculate totals automatically
    function calculateTotals() {
      let total = 0;
      let points = 0;
      document.querySelectorAll("#itemList > div").forEach(div => {
        const qty = parseInt(div.querySelector(".qty").value) || 0;
        const price = parseInt(div.querySelector(".price").value) || 0;
        total += qty * price;
        points += qty; // 1 point per item for example
      });
      document.getElementById("totalAmount").value = total;
      document.getElementById("totalPointsEarned").value = points;
      return { total, points };
    }

    // 🧮 Auto update change amount when paid
    document.getElementById("paidAmount").addEventListener("input", () => {
      const paid = parseFloat(document.getElementById("paidAmount").value) || 0;
      const total = parseFloat(document.getElementById("totalAmount").value) || 0;
      document.getElementById("changeAmount").value = paid - total;
    });

    // 🧾 Submit transaction
    document.getElementById("submitTransactionBtn").onclick = async () => {
      const buyerId = document.getElementById("buyerId").value;
      const buyerName = document.getElementById("buyerName").value;
      const staff = document.getElementById("staff").value;
      const paymentType = document.getElementById("paymentType").value;
      const { total, points } = calculateTotals();
      const paidAmount = parseFloat(document.getElementById("paidAmount").value) || 0;
      const changeAmount = paidAmount - total;
      const dateTime = new Date().toLocaleString();

      // 🧮 Item summary
      let summaryGlass = 0, summaryPocket = 0, summary500ml = 0, summary1L = 0;
      let itemSummary = [];

      document.querySelectorAll("#itemList > div").forEach(div => {
        const name = div.querySelector(".itemName").value;
        const size = div.querySelector(".size").value;
        const qty = parseInt(div.querySelector(".qty").value) || 0;

        itemSummary.push(`${name} ${size} x${qty}`);
        if (size === "Glass") summaryGlass += qty;
        if (size === "Pocket") summaryPocket += qty;
        if (size === "500ml") summary500ml += qty;
        if (size === "1L") summary1L += qty;
      });

      const newTrans = {
        buyerId, buyerName, staff,
        paymentType, totalAmount: total, paidAmount, changeAmount,
        totalPointsEarned: points, updatedMasterPoints: points,
        summaryGlass, summaryPocket, summary500ml, summary1L,
        itemSummary: itemSummary.join(", "),
        dateTime,
      };

      await db.ref("transactions").push(newTrans);

      alert("✅ Transaction saved successfully!");
      window.location.href = "history.html";
    };
  </script>
</body>
</html>
