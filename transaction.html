<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Coffee Loyalty - Transaction</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
</head>
<body class="bg-white p-6 font-sans">

<div class="max-w-xl mx-auto bg-white shadow rounded-lg p-6">
  <h1 class="text-2xl font-bold text-center text-amber-800 mb-4">☕ New Transaction</h1>

  <form id="transactionForm" class="space-y-4">
    <div>
      <label class="block font-semibold">Buyer Name</label>
      <input type="text" id="buyerName" class="border p-2 w-full rounded" required>
    </div>

    <!-- Items & Quantity -->
    <div>
      <label class="block font-semibold">Items</label>
      <input type="text" id="items" placeholder="E.g., Copyaren 175ml × 1" class="border p-2 w-full rounded" required>
    </div>

    <div>
      <label class="block font-semibold">Total Amount (Rp)</label>
      <input type="number" id="totalAmount" class="border p-2 w-full rounded" required>
    </div>

    <div>
      <label class="block font-semibold">Payment Type</label>
      <select id="paymentType" class="border p-2 w-full rounded" required>
        <option value="CASH">CASH</option>
        <option value="QRIS">QRIS</option>
      </select>
    </div>

    <div>
      <label class="block font-semibold">Paid Amount (Rp)</label>
      <input type="number" id="paidAmount" class="border p-2 w-full rounded" required>
    </div>

    <button type="submit" class="bg-amber-700 text-white p-2 px-4 rounded-lg hover:bg-amber-800 transition">
      Submit Transaction
    </button>
  </form>

  <div id="message" class="mt-4 text-center font-semibold text-red-600"></div>
</div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyAWZg7mZe1j2Nwkg5JvPUjf_bdCvfWvN9g",
  authDomain: "kopi-copybara.firebaseapp.com",
  databaseURL: "https://kopi-copybara-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "kopi-copybara",
  storageBucket: "kopi-copybara.appspot.com",
  messagingSenderId: "729875984861",
  appId: "1:729875984861:web:6b1ea2d44f8789c18e4634"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

const form = document.getElementById('transactionForm');
const messageDiv = document.getElementById('message');

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  messageDiv.textContent = "";

  const buyerName = document.getElementById('buyerName').value.trim();
  const items = document.getElementById('items').value.trim();
  const totalAmount = Number(document.getElementById('totalAmount').value);
  const paymentType = document.getElementById('paymentType').value;
  const paidAmount = Number(document.getElementById('paidAmount').value);
  const changeAmount = paidAmount - totalAmount;
  const staff = sessionStorage.getItem('staffName') || 'Unknown';

  if (!buyerName || !items) {
    alert("Please fill in all required fields.");
    return;
  }

  // 🔒 Check if buyer has a pending redemption
  const redemptionsSnap = await db.ref('redemptions').orderByChild('buyerName').equalTo(buyerName).once('value');
  const pendingRedeem = Object.values(redemptionsSnap.val() || {}).some(r => !r.completed);

  if (pendingRedeem) {
    messageDiv.textContent = `⚠️ Buyer "${buyerName}" has a pending redemption. Complete it before a new transaction.`;
    return;
  }

  // ✅ Confirm transaction
  if (!confirm(`Are you sure to submit transaction for ${buyerName}?`)) return;

  // Calculate points (example: 1 point per 10,000 Rp)
  const pointsEarned = Math.floor(totalAmount / 10000);

  const dateTime = new Date().toLocaleString();

  const newTransactionRef = db.ref('transactions').push();
  await newTransactionRef.set({
    dateTime,
    buyerName,
    items,
    totalAmount,
    paymentType,
    paidAmount,
    changeAmount,
    totalPointsEarned: pointsEarned,
    staff
  });

  alert(`Transaction saved! Points earned: ${pointsEarned}`);
  form.reset();
});
</script>
</body>
</html>
