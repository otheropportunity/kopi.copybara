<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Coffee Loyalty - Transaction</title>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js"></script>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
  <style>
    .toast {
      position: fixed;
      top: 20px;
      right: 20px;
      background: #333;
      color: #fff;
      padding: 10px 16px;
      border-radius: 6px;
      opacity: 0;
      transform: translateY(-10px);
      transition: all 0.4s ease;
      z-index: 50;
    }
    .toast.show {
      opacity: 1;
      transform: translateY(0);
    }
  </style>
</head>
<body class="bg-yellow-50 p-4 font-sans">

  <h1 class="text-2xl font-bold text-center text-yellow-800 mb-6">☕ Coffee Loyalty - Transaction</h1>

  <!-- Buyer Search -->
  <div class="max-w-lg mx-auto bg-white p-4 rounded-xl shadow-md">
    <label class="block mb-2 font-semibold text-yellow-900">Member ID</label>
    <div class="flex gap-2 mb-4">
      <input type="text" id="buyerId" placeholder="Enter member ID" class="flex-grow border p-2 rounded">
      <button onclick="searchBuyer()" class="bg-yellow-700 text-white px-4 py-2 rounded">Search</button>
    </div>

    <!-- Buyer Info -->
    <div id="buyerInfo" class="hidden border-t pt-3">

      <!-- 👤 Buyer Summary -->
      <div id="buyerSummary" class="bg-amber-50 border border-amber-200 rounded-lg p-3 mb-4 hidden">
        <h3 class="font-semibold text-amber-800 text-center mb-2">👤 Member Summary</h3>
        <p class="text-center mb-2">Name: <span id="buyerNameDisplay" class="font-bold text-amber-900">-</span></p>
        <p class="text-center mb-3">Total Points: <span id="buyerTotalPoints" class="font-bold text-green-700">0</span></p>
        <div class="grid grid-cols-2 gap-1 text-sm text-center">
          <p>Glass: <span id="glassPoints" class="font-bold text-amber-900">0</span></p>
          <p>Pocket: <span id="pocketPoints" class="font-bold text-amber-900">0</span></p>
          <p>500ml: <span id="ml500Points" class="font-bold text-amber-900">0</span></p>
          <p>1L: <span id="l1Points" class="font-bold text-amber-900">0</span></p>
        </div>
      </div>

      <!-- ☕ Purchase Summary -->
      <div id="purchaseSummaryCard" class="bg-amber-50 border border-amber-200 rounded-lg p-3 mb-4 hidden">
        <h3 class="font-semibold text-amber-800 text-center mb-2">☕ Purchase Summary</h3>
        <div class="grid grid-cols-2 gap-1 text-sm text-center">
          <p>Glass: <span id="sumGlass" class="font-bold text-amber-900">0</span></p>
          <p>Pocket: <span id="sumPocket" class="font-bold text-amber-900">0</span></p>
          <p>500ml: <span id="sum500" class="font-bold text-amber-900">0</span></p>
          <p>1L: <span id="sum1L" class="font-bold text-amber-900">0</span></p>
        </div>
      </div>

      <!-- 🧾 Product Input -->
      <h3 class="font-semibold text-yellow-800 mb-2">Add Purchase</h3>

      <div class="mb-2">
        <label>Copyaren</label>
        <input type="number" id="copyarenQty" min="0" value="0" class="w-full border p-2 rounded">
      </div>

      <div class="mb-2">
        <label>Chocobara</label>
        <input type="number" id="chocobaraQty" min="0" value="0" class="w-full border p-2 rounded">
      </div>

      <div class="mb-4">
        <label>Camericano</label>
        <input type="number" id="camericanoQty" min="0" value="0" class="w-full border p-2 rounded">
      </div>

      <button onclick="submitTransaction()" class="bg-green-600 hover:bg-green-700 text-white w-full py-2 rounded">Submit Transaction</button>
    </div>
  </div>

  <!-- Toast -->
  <div id="toast" class="toast"></div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getDatabase, ref, get, set, update } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

    const firebaseConfig = {
      apiKey: "YOUR_FIREBASE_API_KEY",
      authDomain: "YOUR_FIREBASE_AUTH_DOMAIN",
      databaseURL: "YOUR_FIREBASE_DATABASE_URL",
      projectId: "YOUR_PROJECT_ID",
      storageBucket: "YOUR_STORAGE_BUCKET",
      messagingSenderId: "YOUR_MESSAGING_SENDER_ID",
      appId: "YOUR_APP_ID"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    let currentBuyerId = "";
    let currentBuyerData = {};

    // 🔸 Toast Helper
    function showToast(msg) {
      const toast = document.getElementById("toast");
      toast.textContent = msg;
      toast.classList.add("show");
      setTimeout(() => toast.classList.remove("show"), 2500);
    }

    // 🔸 Buyer Search
    window.searchBuyer = async function () {
      const buyerId = document.getElementById("buyerId").value.trim();
      if (!buyerId) {
        showToast("⚠️ Please enter Member ID");
        return;
      }

      const buyerRef = ref(db, `buyers/${buyerId}`);
      const snapshot = await get(buyerRef);
      if (!snapshot.exists()) {
        showToast("❌ Member not found");
        document.getElementById("buyerInfo").classList.add("hidden");
        return;
      }

      currentBuyerData = snapshot.val();
      currentBuyerId = buyerId;

      document.getElementById("buyerInfo").classList.remove("hidden");
      updateBuyerSummary(currentBuyerData);

      // Save buyer info for redeem.html
      localStorage.setItem("buyerInfo", JSON.stringify({
        id: buyerId,
        name: currentBuyerData.name,
        masterPoints: currentBuyerData.masterPoints || 0,
        glassPoints: currentBuyerData.glassPoints || 0,
        pocketPoints: currentBuyerData.pocketPoints || 0,
        ml500Points: currentBuyerData.ml500Points || 0,
        l1Points: currentBuyerData.l1Points || 0
      }));

      showToast(`✅ Welcome, ${currentBuyerData.name}`);
    }

    // 🔸 Submit Transaction
    window.submitTransaction = async function () {
      if (!currentBuyerId) {
        showToast("⚠️ Search for a member first!");
        return;
      }

      const copyarenQty = parseInt(document.getElementById("copyarenQty").value) || 0;
      const chocobaraQty = parseInt(document.getElementById("chocobaraQty").value) || 0;
      const camericanoQty = parseInt(document.getElementById("camericanoQty").value) || 0;

      if (copyarenQty + chocobaraQty + camericanoQty === 0) {
        showToast("⚠️ Please input purchase quantity!");
        return;
      }

      const newGlass = (currentBuyerData.glassPoints || 0) + copyarenQty + chocobaraQty + camericanoQty;
      const newMaster = (currentBuyerData.masterPoints || 0) + copyarenQty + chocobaraQty + camericanoQty;

      await update(ref(db, `buyers/${currentBuyerId}`), {
        glassPoints: newGlass,
        masterPoints: newMaster
      });

      // Save updated info to localStorage
      localStorage.setItem("buyerInfo", JSON.stringify({
        id: currentBuyerId,
        name: currentBuyerData.name,
        masterPoints: newMaster,
        glassPoints: newGlass,
        pocketPoints: currentBuyerData.pocketPoints || 0,
        ml500Points: currentBuyerData.ml500Points || 0,
        l1Points: currentBuyerData.l1Points || 0
      }));

      updateBuyerSummary({
        name: currentBuyerData.name,
        masterPoints: newMaster,
        glassPoints: newGlass,
        pocketPoints: currentBuyerData.pocketPoints,
        ml500Points: currentBuyerData.ml500Points,
        l1Points: currentBuyerData.l1Points
      });

      updatePurchaseSummary(copyarenQty, chocobaraQty, camericanoQty, 0);

      // Reset form input
      document.getElementById("copyarenQty").value = 0;
      document.getElementById("chocobaraQty").value = 0;
      document.getElementById("camericanoQty").value = 0;

      showToast("✅ Transaction saved!");
    };

    // 🔸 Helper for Buyer Summary
    function updateBuyerSummary(buyerData) {
      document.getElementById("buyerSummary").classList.remove("hidden");
      document.getElementById("buyerNameDisplay").textContent = buyerData.name || "-";
      document.getElementById("buyerTotalPoints").textContent = buyerData.masterPoints || 0;
      document.getElementById("glassPoints").textContent = buyerData.glassPoints || 0;
      document.getElementById("pocketPoints").textContent = buyerData.pocketPoints || 0;
      document.getElementById("ml500Points").textContent = buyerData.ml500Points || 0;
      document.getElementById("l1Points").textContent = buyerData.l1Points || 0;
    }

    // 🔸 Helper for Purchase Summary
    function updatePurchaseSummary(glass, pocket, ml500, l1) {
      document.getElementById("purchaseSummaryCard").classList.remove("hidden");
      document.getElementById("sumGlass").textContent = glass;
      document.getElementById("sumPocket").textContent = pocket;
      document.getElementById("sum500").textContent = ml500;
      document.getElementById("sum1L").textContent = l1;
    }
  </script>
</body>
</html>
