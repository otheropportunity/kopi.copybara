<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Coffee Loyalty - Transaction</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
  <style>
    body { background-color: #fffaf0; font-family: 'Poppins', sans-serif; }
    .card { background: white; border-radius: 12px; padding: 24px; max-width: 500px; margin: 50px auto; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
    select, input[type="number"], input[type="text"] { border: 1px solid #ccc; border-radius: 6px; padding: 6px; }
  </style>
</head>
<body>
  <div class="card">
    <h1 class="text-2xl font-bold text-center text-amber-800 mb-2">☕ Staff Transaction Panel</h1>
    <h2 class="text-lg font-semibold text-center mb-4">
      Welcome, <span id="staffNameDisplay" class="text-amber-700"></span>
    </h2>

    <div class="mb-4">
      <input id="searchBuyer" class="w-full border rounded p-2 mb-2" placeholder="Search Buyer (Name / Phone)" />
      <button onclick="searchBuyer()" class="w-full bg-green-700 text-white p-2 rounded-lg hover:bg-green-800 transition">Search</button>
    </div>

    <div id="buyerInfo" class="hidden border-t pt-3">
      <p><strong>Name:</strong> <span id="buyerFoundName"></span></p>
      <p><strong>Points:</strong> <span id="buyerFoundPoints"></span></p>

      <h3 class="font-semibold mb-2 text-amber-800 mt-4">Select Items:</h3>

      <!-- Copyaren -->
      <div class="mb-3">
        <div class="flex justify-between items-center mb-1">
          <label>Copyaren</label>
          <input type="number" id="copyarenQty" min="0" value="0" class="w-20 text-center">
        </div>
        <select id="copyarenSize" class="w-full">
          <option value="175">Glass 175ml - Rp 10.000</option>
          <option value="250">Pocket 250ml - Rp 20.000</option>
          <option value="500">500ml - Rp 40.000</option>
          <option value="1000">1L - Rp 80.000</option>
        </select>
      </div>

      <!-- Chocobara -->
      <div class="mb-3">
        <div class="flex justify-between items-center mb-1">
          <label>Chocobara</label>
          <input type="number" id="chocobaraQty" min="0" value="0" class="w-20 text-center">
        </div>
        <select id="chocobaraSize" class="w-full">
          <option value="175">Glass 175ml - Rp 12.000</option>
          <option value="250">Pocket 250ml - Rp 24.000</option>
          <option value="500">500ml - Rp 48.000</option>
          <option value="1000">1L - Rp 95.000</option>
        </select>
      </div>

      <!-- Camericano -->
      <div class="mb-3">
        <div class="flex justify-between items-center mb-1">
          <label>Camericano</label>
          <input type="number" id="camericanoQty" min="0" value="0" class="w-20 text-center">
        </div>
        <select id="camericanoSize" class="w-full">
          <option value="175">Glass 175ml - Rp 8.000</option>
          <option value="250">Pocket 250ml - Rp 15.000</option>
          <option value="500">500ml - Rp 30.000</option>
          <option value="1000">1L - Rp 60.000</option>
        </select>
      </div>

      <div class="mt-3">
        <label class="font-semibold text-amber-700">Transaction Type:</label>
        <div class="flex gap-3 mt-2">
          <button type="button" id="btnQRIS" onclick="setPaymentType('QRIS')" class="flex-1 bg-blue-600 text-white p-2 rounded-lg hover:bg-blue-700">QRIS</button>
          <button type="button" id="btnCash" onclick="setPaymentType('CASH')" class="flex-1 bg-green-600 text-white p-2 rounded-lg hover:bg-green-700">CASH</button>
        </div>
        <p class="text-sm mt-2 text-gray-600">Selected: <span id="selectedPayment">None</span></p>
      </div>

      <div id="cashInputSection" class="hidden mt-3 bg-amber-50 border border-amber-200 p-3 rounded-lg">
        <label class="block mb-1 font-semibold">Customer Paid (Rp):</label>
        <input type="number" id="cashPaid" min="0" class="w-full p-2 border rounded" placeholder="Enter paid amount" />
        <p class="text-sm text-gray-600 mt-2">Change: Rp <span id="changeAmount">0</span></p>
      </div>

      <div class="mt-4 bg-amber-50 p-3 rounded-lg border border-amber-200">
        <p><strong>Total Amount:</strong> Rp <span id="totalAmount">0</span></p>
        <p><strong>Points Earned:</strong> <span id="totalPoints">0</span></p>
      </div>

      <button onclick="calculateTotal()" class="w-full bg-yellow-600 text-white p-2 rounded-lg mt-3 hover:bg-yellow-700">🧮 Calculate Total</button>
      <button id="submitBtn" onclick="submitTransaction()" class="w-full bg-amber-700 text-white p-2 rounded-lg mt-3 hover:bg-amber-800">Submit Transaction</button>
      <button onclick="goToRedeem()" class="w-full bg-blue-700 text-white p-2 rounded-lg mt-3 hover:bg-blue-800">Redeem Points</button>
    </div>

    <div class="mt-6 space-y-3">
      <button onclick="window.location.href='history.html'" class="w-full bg-yellow-600 text-white p-2 rounded-lg hover:bg-yellow-700">View Transaction History</button>
      <button onclick="logoutStaff()" class="w-full bg-gray-300 text-gray-800 p-2 rounded-lg hover:bg-gray-400">Logout</button>
    </div>
  </div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyAWZg7mZe1j2Nwkg5JvPUjf_bdCvfWvN9g",
  authDomain: "kopi-copybara.firebaseapp.com",
  databaseURL: "https://kopi-copybara-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "kopi-copybara",
  storageBucket: "kopi-copybara.appspot.com",
  messagingSenderId: "729875984861",
  appId: "1:729875984861:web:6b1ea2d44f8789c18e4634"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

let currentBuyerId = null;
let currentBuyerName = "";
let currentBuyerPoints = 0;
let paymentType = null;

const prices = {
  copyaren: {175: 10000, 250: 20000, 500: 40000, 1000: 80000},
  chocobara: {175: 12000, 250: 24000, 500: 48000, 1000: 95000},
  camericano: {175: 8000, 250: 15000, 500: 30000, 1000: 60000}
};

// === Staff session check ===
document.addEventListener("DOMContentLoaded", () => {
  const staffName = sessionStorage.getItem("staffName");
  if (!staffName) { alert("Session expired or not logged in."); window.location.href="index.html"; return; }
  document.getElementById("staffNameDisplay").textContent = staffName;
});

function setPaymentType(type){
  paymentType = type;
  document.getElementById("selectedPayment").textContent = type;
  document.getElementById("cashInputSection").classList.toggle("hidden", type!=="CASH");
}

// === Search Buyer ===
function searchBuyer(){
  const query = document.getElementById("searchBuyer").value.trim().toLowerCase();
  if(!query) return alert("Enter buyer name or phone!");
  db.ref("buyers").once("value").then(snapshot=>{
    let found=false;
    snapshot.forEach(child=>{
      const data = child.val();
      if((data.name && data.name.toLowerCase().includes(query)) || (data.phone && data.phone.includes(query))){
        found=true;
        currentBuyerId = child.key;
        currentBuyerName = data.name;
        currentBuyerPoints = data.masterPoints || data.masterPoint || data.points || 0;

        document.getElementById("buyerFoundName").innerText = currentBuyerName;
        document.getElementById("buyerFoundPoints").innerText = currentBuyerPoints;
        document.getElementById("buyerInfo").classList.remove("hidden");

        const memberData = { name: currentBuyerName, password: data.password || "", points: currentBuyerPoints };
        sessionStorage.setItem("currentMember", JSON.stringify(memberData));
        sessionStorage.setItem("currentBuyerId", currentBuyerId);
        sessionStorage.setItem("currentBuyerName", currentBuyerName);
        sessionStorage.setItem("currentBuyerPoints", currentBuyerPoints);
      }
    });
    if(!found) alert("Buyer not found!");
  });
}

// === Calculate Total + Accumulate ===
function calculateTotal(){
  const cQ=parseInt(document.getElementById("copyarenQty").value)||0;
  const cS=document.getElementById("copyarenSize").value;
  const bQ=parseInt(document.getElementById("chocobaraQty").value)||0;
  const bS=document.getElementById("chocobaraSize").value;
  const aQ=parseInt(document.getElementById("camericanoQty").value)||0;
  const aS=document.getElementById("camericanoSize").value;

  const totalAmount=cQ*prices.copyaren[cS]+bQ*prices.chocobara[bS]+aQ*prices.camericano[aS];
  const totalPoints=cQ+bQ+aQ;
  document.getElementById("totalAmount").textContent=totalAmount.toLocaleString();
  document.getElementById("totalPoints").textContent=totalPoints;

  if(paymentType==="CASH"){
    const paid=parseInt(document.getElementById("cashPaid").value)||0;
    const change=paid>0?Math.max(0,paid-totalAmount):0;
    document.getElementById("changeAmount").textContent=change.toLocaleString();
  }

  // === Size classification (Glass, Pocket, 500ml, 1L)
  const purchaseSummary = { glass: 0, pocket: 0, ml500: 0, l1: 0 };

  function classifySize(size, qty) {
    if (size === "175") purchaseSummary.glass += qty;
    else if (size === "250") purchaseSummary.pocket += qty;
    else if (size === "500") purchaseSummary.ml500 += qty;
    else if (size === "1000") purchaseSummary.l1 += qty;
  }

  classifySize(cS, cQ);
  classifySize(bS, bQ);
  classifySize(aS, aQ);

  // ✅ Merge with existing session summary (accumulate counts)
  const prevSummary = JSON.parse(sessionStorage.getItem("purchaseSummary") || "{}");
  for (let key in purchaseSummary) {
    if (prevSummary[key]) purchaseSummary[key] += prevSummary[key];
  }

  // ✅ Save back to sessionStorage (used by redeem.html)
  sessionStorage.setItem("purchaseSummary", JSON.stringify(purchaseSummary));

  return { totalAmount, totalPoints, cQ, cS, bQ, bS, aQ, aS };
}

// === Submit Transaction ===
function submitTransaction(){
  if(!currentBuyerId) return alert("Search for a buyer first!");
  if(!paymentType) return alert("Select payment type!");

  const submitBtn=document.getElementById("submitBtn");
  submitBtn.disabled=true; submitBtn.textContent="Processing...";

  db.ref("system/redemptionLock").once("value").then(lockSnap=>{
    if(lockSnap.val()) {
      alert("❌ Cannot process transaction while redemption is in progress!");
      submitBtn.disabled=false; submitBtn.textContent="Submit Transaction";
      return;
    }

    const { totalAmount,totalPoints,cQ,cS,bQ,bS,aQ,aS } = calculateTotal();
    if(totalAmount===0) {
      alert("Please select items!");
      submitBtn.disabled=false; submitBtn.textContent="Submit Transaction";
      return;
    }

    const confirmPurchase = confirm(`Confirm transaction?\nTotal: Rp ${totalAmount.toLocaleString()}\nPayment: ${paymentType}`);
    if(!confirmPurchase){ submitBtn.disabled=false; submitBtn.textContent="Submit Transaction"; return; }

    const paidAmount = paymentType==="CASH" ? parseInt(document.getElementById("cashPaid").value)||0 : totalAmount;
    const changeAmount = paymentType==="CASH" ? Math.max(0,paidAmount-totalAmount) : 0;
    const staffName = sessionStorage.getItem("staffName") || "Unknown";
    const now = new Date().toLocaleString("en-GB");

    const buyerRef = db.ref("buyers/" + currentBuyerId);
    buyerRef.once("value").then(snap => {
      const buyerData = snap.val() || {};
      const currentMaster = buyerData.masterPoints || buyerData.masterPoint || buyerData.points || 0;
      const newMaster = currentMaster + totalPoints;

      buyerRef.update({
        masterPoints: newMaster,
        lastTransactionPoint: totalPoints
      }).then(()=>{
        db.ref("transactions").push({
          buyerId: currentBuyerId,
          buyerName: currentBuyerName,
          copyarenQty: cQ, copyarenSize: cS,
          chocobaraQty: bQ, chocobaraSize: bS,
          camericanoQty: aQ, camericanoSize: aS,
          totalAmount, paymentType, paidAmount, changeAmount,
          totalPointsEarned: totalPoints,
          updatedMasterPoints: newMaster,
          staff: staffName,
          dateTime: now
        }).then(()=>{
          alert("✅ Transaction successful!");
          
          // ✅ Update buyer size summary for redeem rules
          const buyerRefSummary = db.ref("buyers/" + currentBuyerId);
          buyerRefSummary.once("value").then(snapshot => {
            if (snapshot.exists()) {
              const buyerData = snapshot.val();

              // existing summary counts (or 0 if none)
              const currentGlass = buyerData.summaryGlass || 0;
              const currentPocket = buyerData.summaryPocket || 0;
              const current500ml = buyerData.summary500ml || 0;
              const current1L = buyerData.summary1L || 0;

              // per-transaction add count
              let addGlass = 0, addPocket = 0, add500ml = 0, add1L = 0;

              const drinkSizes = [
                { qty: cQ, size: cS },
                { qty: bQ, size: bS },
                { qty: aQ, size: aS }
              ];

              drinkSizes.forEach(item => {
                if (!item.size) return;
                if (item.size.includes("175")) addGlass += parseInt(item.qty) || 0;
                else if (item.size.includes("250")) addPocket += parseInt(item.qty) || 0;
                else if (item.size.includes("500")) add500ml += parseInt(item.qty) || 0;
                else if (item.size.includes("1000") || item.size.includes("1L")) add1L += parseInt(item.qty) || 0;
              });

              // ✅ Update buyer summary in Firebase
              buyerRefSummary.update({
                summaryGlass: currentGlass + addGlass,
                summaryPocket: currentPocket + addPocket,
                summary500ml: current500ml + add500ml,
                summary1L: current1L + add1L
              });
            }
          });

          // Reset form inputs only
          document.getElementById("copyarenQty").value=0;
          document.getElementById("chocobaraQty").value=0;
          document.getElementById("camericanoQty").value=0;
          document.getElementById("cashPaid").value="";
          document.getElementById("changeAmount").textContent="0";
          document.getElementById("totalAmount").textContent="0";
          document.getElementById("totalPoints").textContent="0";
          document.getElementById("selectedPayment").textContent="None";
          document.getElementById("cashInputSection").classList.add("hidden");
          paymentType=null;

          // Update displayed buyer points
          document.getElementById("buyerFoundPoints").innerText=newMaster;
          currentBuyerPoints=newMaster;
          const updatedMember=JSON.parse(sessionStorage.getItem("currentMember")||"{}");
          updatedMember.points=newMaster;
          sessionStorage.setItem("currentMember",JSON.stringify(updatedMember));

          submitBtn.disabled=false;
          submitBtn.textContent="Submit Transaction";
        });
      }).catch(err=>{
        console.error(err);
        alert("❌ Failed to update buyer points: "+err.message);
        submitBtn.disabled=false;
        submitBtn.textContent="Submit Transaction";
      });
    });
  });
}

function goToRedeem(){
  const memberData=JSON.parse(sessionStorage.getItem("currentMember")||"{}");
  if(!memberData.name){ alert("⚠️ Please search and select a buyer first!"); return; }
  window.location.href="redeem.html";
}

function logoutStaff(){
  // optional: clear accumulated summary when logout
  sessionStorage.removeItem("purchaseSummary");
  sessionStorage.clear();
  window.location.href="index.html";
}
</script>
</body>
</html>
