<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kopi Copybara - Transaction</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyAWZg7mZe1j2Nwkg5JvPUjf_bdCvfWvN9g",
      authDomain: "kopi-copybara.firebaseapp.com",
      databaseURL: "https://kopi-copybara-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "kopi-copybara",
      storageBucket: "kopi-copybara.appspot.com",
      messagingSenderId: "729875984861",
      appId: "1:729875984861:web:6b1ea2d44f8789c18e4634"
    };
    firebase.initializeApp(firebaseConfig);
  </script>

  <style>
    body {
      background-color: #fffaf0;
      font-family: 'Poppins', sans-serif;
    }
    .card {
      background: white;
      border-radius: 12px;
      padding: 24px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      max-width: 600px;
      margin: 40px auto;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1 class="text-2xl font-bold text-center text-amber-800 mb-4">☕ Kopi Copybara - Transaction</h1>

    <div class="flex gap-2 mb-4">
      <input id="searchInput" type="text" placeholder="Enter buyer name or phone" class="flex-grow border rounded p-2" />
      <button onclick="searchBuyer()" class="bg-green-700 text-white px-4 py-2 rounded">Search</button>
    </div>

    <div id="buyerInfo" class="hidden mb-4">
      <p><strong>Name:</strong> <span id="buyerName"></span></p>
      <p><strong>Points:</strong> <span id="buyerPoints"></span></p>
    </div>

    <div id="transactionForm" class="hidden">
      <h3 class="text-lg font-semibold text-amber-800 mb-2">Select Items</h3>

      <!-- Copyaren -->
      <div class="mb-2">
        <label>Copyaren</label>
        <div class="flex gap-2 mb-1">
          <input type="number" id="copyarenQty" min="0" value="0" class="w-16 border rounded text-center" />
          <select id="copyarenSize" class="flex-grow border rounded p-1">
            <option value="10000">Glass 175ml - Rp 10.000</option>
            <option value="20000">Pocket 250ml - Rp 20.000</option>
            <option value="40000">500ml - Rp 40.000</option>
            <option value="80000">1L - Rp 80.000</option>
          </select>
        </div>
      </div>

      <!-- Chocobara -->
      <div class="mb-2">
        <label>Chocobara</label>
        <div class="flex gap-2 mb-1">
          <input type="number" id="chocobaraQty" min="0" value="0" class="w-16 border rounded text-center" />
          <select id="chocobaraSize" class="flex-grow border rounded p-1">
            <option value="12000">Glass 175ml - Rp 12.000</option>
            <option value="24000">Pocket 250ml - Rp 24.000</option>
            <option value="48000">500ml - Rp 48.000</option>
            <option value="95000">1L - Rp 95.000</option>
          </select>
        </div>
      </div>

      <!-- Camericano -->
      <div class="mb-2">
        <label>Camericano</label>
        <div class="flex gap-2 mb-1">
          <input type="number" id="camericanoQty" min="0" value="0" class="w-16 border rounded text-center" />
          <select id="camericanoSize" class="flex-grow border rounded p-1">
            <option value="8000">Glass 175ml - Rp 8.000</option>
            <option value="15000">Pocket 250ml - Rp 15.000</option>
            <option value="30000">500ml - Rp 30.000</option>
            <option value="60000">1L - Rp 60.000</option>
          </select>
        </div>
      </div>

      <div class="my-3">
        <label>Payment Type</label>
        <select id="paymentType" class="w-full border rounded p-2">
          <option value="QRIS">QRIS</option>
          <option value="CASH">CASH</option>
        </select>
      </div>

      <div class="flex flex-col gap-2">
        <button onclick="confirmTransaction()" class="bg-amber-700 text-white p-2 rounded-lg">Submit Transaction</button>
        <button onclick="goToRedeem()" class="bg-green-700 text-white p-2 rounded-lg">🎁 Redeem Points</button>
        <button onclick="logout()" class="bg-red-600 text-white p-2 rounded-lg">Logout</button>
      </div>
    </div>
  </div>

  <script>
    const db = firebase.database();
    let currentBuyerId = null;
    let currentBuyerName = null;
    let currentBuyerPoints = 0;

    function searchBuyer() {
      const input = document.getElementById("searchInput").value.trim().toLowerCase();
      if (!input) return alert("Enter buyer name or phone number.");
      db.ref("buyers").once("value").then(snapshot => {
        let found = false;
        snapshot.forEach(child => {
          const buyer = child.val();
          if (buyer.name.toLowerCase() === input || buyer.phone === input) {
            currentBuyerId = child.key;
            currentBuyerName = buyer.name;
            currentBuyerPoints = buyer.points || 0;
            document.getElementById("buyerName").textContent = buyer.name;
            document.getElementById("buyerPoints").textContent = buyer.points || 0;
            document.getElementById("buyerInfo").classList.remove("hidden");
            document.getElementById("transactionForm").classList.remove("hidden");
            found = true;
          }
        });
        if (!found) alert("Buyer not found!");
      });
    }

    function calculateTotal() {
      const cpy = document.getElementById("copyarenQty").value * document.getElementById("copyarenSize").value;
      const chc = document.getElementById("chocobaraQty").value * document.getElementById("chocobaraSize").value;
      const cam = document.getElementById("camericanoQty").value * document.getElementById("camericanoSize").value;
      return cpy + chc + cam;
    }

    function confirmTransaction() {
      const total = calculateTotal();
      if (total <= 0) return alert("Please select items.");
      if (confirm(`Confirm transaction for Rp ${total.toLocaleString()} ?`)) saveTransaction(total);
    }

    function saveTransaction(total) {
      const data = {
        buyerId: currentBuyerId,
        buyer: currentBuyerName,
        total,
        pointsEarned: Math.floor(total / 10000),
        date: new Date().toISOString()
      };
      db.ref("transactions/" + Date.now()).set(data).then(() => {
        const newPoints = currentBuyerPoints + data.pointsEarned;
        db.ref("buyers/" + currentBuyerId).update({ points: newPoints });
        currentBuyerPoints = newPoints;
        document.getElementById("buyerPoints").textContent = newPoints;
        resetForm();
        alert("✅ Transaction saved!");
      });
    }

    function resetForm() {
      ["copyarenQty","chocobaraQty","camericanoQty"].forEach(id => document.getElementById(id).value = 0);
      ["copyarenSize","chocobaraSize","camericanoSize"].forEach(id => document.getElementById(id).selectedIndex = 0);
      document.getElementById("paymentType").selectedIndex = 0;
    }

    function goToRedeem() {
      if (!currentBuyerId) return alert("Search buyer first.");
      sessionStorage.setItem("currentBuyerId", currentBuyerId);
      sessionStorage.setItem("currentBuyerName", currentBuyerName);
      sessionStorage.setItem("currentBuyerPoints", currentBuyerPoints);
      window.location.href = "redeem.html";
    }

    function logout() {
      sessionStorage.clear();
      window.location.href = "index.html";
    }
  </script>
</body>
</html>
