<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Transaction Page</title>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
      background: #f2f2f2;
    }
    h2 {
      text-align: center;
    }
    .container {
      background: white;
      border-radius: 10px;
      padding: 20px;
      max-width: 700px;
      margin: auto;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }
    input, select, button {
      margin: 8px 0;
      padding: 8px;
      width: 100%;
      border-radius: 6px;
      border: 1px solid #ccc;
    }
    button {
      background-color: #007bff;
      color: white;
      border: none;
      cursor: pointer;
    }
    button:hover {
      background-color: #0056b3;
    }
    .row {
      display: flex;
      gap: 10px;
      align-items: center;
    }
    .row > * {
      flex: 1;
    }
    .hidden {
      display: none;
    }
    .summary {
      margin-top: 15px;
      font-weight: bold;
    }
    .payment-buttons button {
      width: 48%;
      font-size: 16px;
    }
    .payment-buttons {
      display: flex;
      justify-content: space-between;
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>Transaction Page</h2>

    <h3>Search Buyer</h3>
    <input type="text" id="searchBuyer" placeholder="Enter buyer name or phone...">
    <button onclick="searchBuyer()">Search</button>

    <div id="buyerInfo" class="hidden">
      <p><strong>Buyer Name:</strong> <span id="buyerFoundName"></span></p>
      <p><strong>Current Points:</strong> <span id="buyerFoundPoints"></span></p>
    </div>

    <h3>Order Details</h3>
    <div class="row">
      <label>Copyaren:</label>
      <select id="copyarenSize">
        <option value="10000">Glass 175ml - Rp 10,000</option>
        <option value="20000">Pocket 250ml - Rp 20,000</option>
        <option value="40000">500ml - Rp 40,000</option>
        <option value="80000">1L - Rp 80,000</option>
      </select>
      <input type="number" id="copyarenQty" placeholder="Qty" min="0" value="0">
    </div>

    <div class="row">
      <label>Chocobara:</label>
      <select id="chocobaraSize">
        <option value="12000">Glass 175ml - Rp 12,000</option>
        <option value="24000">Pocket 250ml - Rp 24,000</option>
        <option value="48000">500ml - Rp 48,000</option>
        <option value="95000">1L - Rp 95,000</option>
      </select>
      <input type="number" id="chocobaraQty" placeholder="Qty" min="0" value="0">
    </div>

    <div class="row">
      <label>Camericano:</label>
      <select id="camericanoSize">
        <option value="8000">Glass 175ml - Rp 8,000</option>
        <option value="15000">Pocket 250ml - Rp 15,000</option>
        <option value="30000">500ml - Rp 30,000</option>
        <option value="60000">1L - Rp 60,000</option>
      </select>
      <input type="number" id="camericanoQty" placeholder="Qty" min="0" value="0">
    </div>

    <button onclick="calculateTotal()">Calculate Total</button>

    <div class="summary">
      Total Amount: Rp <span id="totalAmount">0</span><br>
      Total Points: <span id="totalPoints">0</span>
    </div>

    <div class="payment-buttons">
      <button onclick="selectPayment('QRIS')">Pay with QRIS</button>
      <button onclick="selectPayment('CASH')">Pay with Cash</button>
    </div>

    <div id="cashInputSection" class="hidden">
      <h4>Cash Payment</h4>
      <input type="number" id="cashPaid" placeholder="Enter cash amount...">
      <button onclick="calculateChange()">Calculate Change</button>
      <p>Change: Rp <span id="changeAmount">0</span></p>
    </div>

    <button onclick="submitTransaction()">Submit Transaction</button>
    <button onclick="newTransaction()">New Transaction</button>

    <p class="summary">Payment Type: <span id="selectedPayment">None</span></p>
  </div>

  <script>
    // === Firebase Config ===
    const firebaseConfig = {
      apiKey: "YOUR_API_KEY",
      authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
      databaseURL: "https://YOUR_PROJECT_ID.firebaseio.com",
      projectId: "YOUR_PROJECT_ID",
      storageBucket: "YOUR_PROJECT_ID.appspot.com",
      messagingSenderId: "SENDER_ID",
      appId: "APP_ID"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let currentBuyerId = null;
    let currentBuyerPoints = 0;
    let paymentType = null;

    // === Search Buyer ===
    function searchBuyer() {
      const query = document.getElementById("searchBuyer").value.trim().toLowerCase();
      if (!query) return alert("Enter buyer name or phone!");

      db.ref("buyers").once("value").then(snapshot => {
        let found = false;
        snapshot.forEach(child => {
          const data = child.val();
          if ((data.name && data.name.toLowerCase().includes(query)) ||
              (data.phone && data.phone.includes(query))) {
            found = true;
            currentBuyerId = child.key;
            currentBuyerPoints = data.points || 0;
            document.getElementById("buyerFoundName").innerText = data.name;
            document.getElementById("buyerFoundPoints").innerText = currentBuyerPoints;
            document.getElementById("buyerInfo").classList.remove("hidden");
          }
        });
        if (!found) alert("Buyer not found!");
      });
    }

    // === Calculate Total ===
    function calculateTotal() {
      const copyarenTotal = document.getElementById("copyarenQty").value * document.getElementById("copyarenSize").value;
      const chocobaraTotal = document.getElementById("chocobaraQty").value * document.getElementById("chocobaraSize").value;
      const camericanoTotal = document.getElementById("camericanoQty").value * document.getElementById("camericanoSize").value;

      const total = copyarenTotal + chocobaraTotal + camericanoTotal;
      document.getElementById("totalAmount").innerText = total.toLocaleString();

      const points = Math.floor(total / 10000);
      document.getElementById("totalPoints").innerText = points;
    }

    // === Select Payment ===
    function selectPayment(type) {
      paymentType = type;
      document.getElementById("selectedPayment").innerText = type;

      if (type === "CASH") {
        document.getElementById("cashInputSection").classList.remove("hidden");
      } else {
        document.getElementById("cashInputSection").classList.add("hidden");
      }
    }

    // === Calculate Change ===
    function calculateChange() {
      const total = parseInt(document.getElementById("totalAmount").innerText.replace(/,/g, ''));
      const paid = parseInt(document.getElementById("cashPaid").value);
      if (isNaN(paid) || paid < total) return alert("Not enough cash!");
      document.getElementById("changeAmount").innerText = (paid - total).toLocaleString();
    }

    // === Submit Transaction ===
    function submitTransaction() {
      if (!currentBuyerId) return alert("Please search for a buyer first!");
      const total = parseInt(document.getElementById("totalAmount").innerText.replace(/,/g, ''));
      if (total <= 0) return alert("Please select at least one product!");
      if (!paymentType) return alert("Please select payment type!");

      const points = parseInt(document.getElementById("totalPoints").innerText);
      const newPoints = currentBuyerPoints + points;

      const transactionData = {
        buyerId: currentBuyerId,
        totalAmount: total,
        pointsEarned: points,
        paymentType,
        date: new Date().toLocaleString()
      };

      if (confirm("Are you sure with this transaction?")) {
        db.ref("transactions").push(transactionData);
        db.ref("buyers/" + currentBuyerId + "/points").set(newPoints);
        alert("Transaction successful!");
        newTransaction();
      }
    }

    // === New Transaction / Reset Form ===
    function newTransaction() {
      document.getElementById("buyerInfo").classList.add("hidden");
      document.getElementById("searchBuyer").value = "";
      ["copyarenQty","chocobaraQty","camericanoQty"].forEach(id => document.getElementById(id).value = 0);
      ["copyarenSize","chocobaraSize","camericanoSize"].forEach(id => document.getElementById(id).selectedIndex = 0); // reset dropdowns
      document.getElementById("totalAmount").textContent = "0";
      document.getElementById("totalPoints").textContent = "0";
      document.getElementById("selectedPayment").textContent = "None";
      document.getElementById("cashInputSection").classList.add("hidden");
      document.getElementById("cashPaid").value = "";
      document.getElementById("changeAmount").textContent = "0";
      paymentType = null;
    }
  </script>
</body>
</html>
