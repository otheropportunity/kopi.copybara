<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Coffee Loyalty - Transaction Entry</title>
  <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-database.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css">
</head>
<body class="bg-gray-100 p-6">
  <div class="max-w-4xl mx-auto bg-white shadow-lg rounded-lg p-6">
    <h2 class="text-2xl font-bold mb-4 text-center">Coffee Loyalty - Transaction Entry</h2>

    <!-- Current DateTime -->
    <div class="text-right mb-4 text-gray-600" id="currentDateTime"></div>

    <form id="transactionForm" class="space-y-4">
      <div class="grid grid-cols-2 gap-4">
        <div>
          <label class="block text-gray-700">Buyer Name</label>
          <input type="text" id="buyerName" class="w-full border p-2 rounded" required>
        </div>

        <div>
          <label class="block text-gray-700">Buyer ID</label>
          <input type="text" id="buyerId" class="w-full border p-2 rounded" required>
        </div>
      </div>

      <!-- Items Section -->
      <div class="border-t pt-4">
        <h3 class="text-lg font-semibold mb-2">Items Purchased</h3>

        <div id="itemsContainer">
          <div class="flex space-x-2 mb-2 item-row">
            <input type="text" placeholder="Item Name" class="itemName border p-2 rounded w-1/2">
            <input type="number" placeholder="Qty" class="itemQty border p-2 rounded w-1/4" min="1">
            <input type="number" placeholder="Price" class="itemPrice border p-2 rounded w-1/4" min="0">
          </div>
        </div>

        <button type="button" id="addItemBtn" class="bg-green-500 text-white px-3 py-1 rounded">+ Add Item</button>
      </div>

      <!-- Summary Totals -->
      <div class="grid grid-cols-2 gap-4 mt-4">
        <div>
          <label class="block text-gray-700">Total Amount</label>
          <input type="number" id="totalAmount" class="w-full border p-2 rounded bg-gray-100" readonly>
        </div>

        <div>
          <label class="block text-gray-700">Paid Amount</label>
          <input type="number" id="paidAmount" class="w-full border p-2 rounded">
        </div>

        <div>
          <label class="block text-gray-700">Change</label>
          <input type="number" id="changeAmount" class="w-full border p-2 rounded bg-gray-100" readonly>
        </div>

        <div>
          <label class="block text-gray-700">Payment Type</label>
          <select id="paymentType" class="w-full border p-2 rounded">
            <option>Cash</option>
            <option>QRIS</option>
            <option>Card</option>
          </select>
        </div>
      </div>

      <!-- Staff -->
      <div>
        <label class="block text-gray-700">Staff</label>
        <input type="text" id="staff" class="w-full border p-2 rounded">
      </div>

      <button type="submit" class="bg-blue-600 text-white px-4 py-2 rounded w-full font-semibold">Submit Transaction</button>
    </form>
  </div>

  <script type="module">
    // ===== Firebase Setup =====
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.6.10/firebase-app.js";
    import { getDatabase, ref, push, set } from "https://www.gstatic.com/firebasejs/9.6.10/firebase-database.js";

    const firebaseConfig = {
      apiKey: "YOUR_API_KEY",
      authDomain: "YOUR_PROJECT.firebaseapp.com",
      databaseURL: "https://YOUR_PROJECT.firebaseio.com",
      projectId: "YOUR_PROJECT_ID",
      storageBucket: "YOUR_PROJECT.appspot.com",
      messagingSenderId: "YOUR_SENDER_ID",
      appId: "YOUR_APP_ID"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    // ===== Real-time Clock =====
    function updateDateTime() {
      const now = new Date();
      document.getElementById('currentDateTime').textContent = now.toLocaleString();
    }
    setInterval(updateDateTime, 1000);
    updateDateTime();

    // ===== Add Item Button =====
    document.getElementById('addItemBtn').addEventListener('click', () => {
      const div = document.createElement('div');
      div.classList.add('flex', 'space-x-2', 'mb-2', 'item-row');
      div.innerHTML = `
        <input type="text" placeholder="Item Name" class="itemName border p-2 rounded w-1/2">
        <input type="number" placeholder="Qty" class="itemQty border p-2 rounded w-1/4" min="1">
        <input type="number" placeholder="Price" class="itemPrice border p-2 rounded w-1/4" min="0">
      `;
      document.getElementById('itemsContainer').appendChild(div);
    });

    // ===== Calculate Totals =====
    function calculateTotal() {
      const rows = document.querySelectorAll('.item-row');
      let total = 0;
      rows.forEach(row => {
        const qty = parseFloat(row.querySelector('.itemQty').value) || 0;
        const price = parseFloat(row.querySelector('.itemPrice').value) || 0;
        total += qty * price;
      });
      document.getElementById('totalAmount').value = total.toFixed(2);
      calculateChange();
    }

    function calculateChange() {
      const paid = parseFloat(document.getElementById('paidAmount').value) || 0;
      const total = parseFloat(document.getElementById('totalAmount').value) || 0;
      const change = paid - total;
      document.getElementById('changeAmount').value = change.toFixed(2);
    }

    document.getElementById('itemsContainer').addEventListener('input', calculateTotal);
    document.getElementById('paidAmount').addEventListener('input', calculateChange);

    // ===== Calculate Summary Fields =====
    function calculateSummaries(items) {
      let summaryGlass = 0;
      let summaryPocket = 0;
      let summary500ml = 0;
      let summary1L = 0;

      items.forEach(item => {
        const nameLower = item.name.toLowerCase();
        if (nameLower.includes("glass")) summaryGlass += item.qty;
        if (nameLower.includes("pocket")) summaryPocket += item.qty;
        if (nameLower.includes("500ml")) summary500ml += item.qty;
        if (nameLower.includes("1l") || nameLower.includes("1 l")) summary1L += item.qty;
      });

      return { summaryGlass, summaryPocket, summary500ml, summary1L };
    }

    // ===== Submit Transaction =====
    document.getElementById('transactionForm').addEventListener('submit', async (e) => {
      e.preventDefault();

      const buyerId = document.getElementById('buyerId').value.trim();
      const buyerName = document.getElementById('buyerName').value.trim();
      const paymentType = document.getElementById('paymentType').value;
      const staff = document.getElementById('staff').value.trim();
      const totalAmount = parseFloat(document.getElementById('totalAmount').value) || 0;
      const paidAmount = parseFloat(document.getElementById('paidAmount').value) || 0;
      const changeAmount = parseFloat(document.getElementById('changeAmount').value) || 0;

      const items = [];
      document.querySelectorAll('.item-row').forEach(row => {
        const name = row.querySelector('.itemName').value.trim();
        const qty = parseInt(row.querySelector('.itemQty').value) || 0;
        const price = parseFloat(row.querySelector('.itemPrice').value) || 0;
        if (name && qty > 0) {
          items.push({ name, qty, price });
        }
      });

      const { summaryGlass, summaryPocket, summary500ml, summary1L } = calculateSummaries(items);
      const now = new Date().toLocaleString();

      const newTxnRef = push(ref(db, "transactions"));
      await set(newTxnRef, {
        buyerId,
        buyerName,
        dateTime: now,
        items,
        totalAmount,
        paidAmount,
        changeAmount,
        paymentType,
        staff,
        summaryGlass,
        summaryPocket,
        summary500ml,
        summary1L
      });

      alert("✅ Transaction saved successfully!");
      document.getElementById('transactionForm').reset();
      document.getElementById('totalAmount').value = '';
      document.getElementById('changeAmount').value = '';
    });
  </script>
</body>
</html>
