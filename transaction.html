<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Coffee Loyalty - Transaction</title>
  <script type="module">
    // Firebase Initialization
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import {
      getDatabase, ref, get, update
    } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

    const firebaseConfig = {
      apiKey: "YOUR_FIREBASE_API_KEY",
      authDomain: "YOUR_FIREBASE_AUTH_DOMAIN",
      databaseURL: "YOUR_FIREBASE_DB_URL",
      projectId: "YOUR_FIREBASE_PROJECT_ID",
      storageBucket: "YOUR_FIREBASE_BUCKET",
      messagingSenderId: "YOUR_FIREBASE_SENDER_ID",
      appId: "YOUR_FIREBASE_APP_ID"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    let buyerEmailGlobal = "";

    // Search member
    window.searchMember = function () {
      const keyword = document.getElementById("searchInput").value.trim().toLowerCase();
      if (!keyword) return;

      const userRef = ref(db, `buyers/${keyword.replace(/\./g, "_")}`);
      get(userRef).then(snapshot => {
        if (snapshot.exists()) {
          const data = snapshot.val();
          buyerEmailGlobal = keyword.replace(/\./g, "_");

          document.getElementById("buyerName").textContent = data.name;
          document.getElementById("memberTotalPoints").textContent = data.masterPoints || 0;
          document.getElementById("memberGlass").textContent = data.summaryGlass || 0;
          document.getElementById("memberPocket").textContent = data.summaryPocket || 0;
          document.getElementById("member500ml").textContent = data.summary500ml || 0;
          document.getElementById("member1L").textContent = data.summary1L || 0;
        } else {
          showToast("⚠️ No member found. Please go back to Transaction page.");
        }
      });
    };

    // Submit transaction
    window.submitTransaction = function () {
      const buyerName = document.getElementById("buyerName").textContent;
      if (!buyerName) {
        showToast("⚠️ Please search for a member first.");
        return;
      }

      const userRef = ref(db, `buyers/${buyerEmailGlobal}`);

      // initialize counts
      const updates = { summaryGlass: 0, summaryPocket: 0, summary500ml: 0, summary1L: 0 };
      let totalPointsEarned = 0;

      const products = ["copyaren", "chocobara", "camericano"];
      products.forEach(prod => {
        const qty = parseInt(document.getElementById(`${prod}Qty`)?.value || 0);
        const size = document.getElementById(`${prod}Size`)?.value;

        if (qty > 0) {
          totalPointsEarned += qty;
          if (size === "glass") updates.summaryGlass += qty;
          else if (size === "pocket") updates.summaryPocket += qty;
          else if (size === "500ml") updates.summary500ml += qty;
          else if (size === "1l") updates.summary1L += qty;
        }
      });

      if (totalPointsEarned === 0) {
        showToast("⚠️ Please enter at least one product quantity.");
        return;
      }

      get(userRef).then(snapshot => {
        if (snapshot.exists()) {
          const data = snapshot.val();

          const newGlass = (data.summaryGlass || 0) + updates.summaryGlass;
          const newPocket = (data.summaryPocket || 0) + updates.summaryPocket;
          const new500ml = (data.summary500ml || 0) + updates.summary500ml;
          const new1L = (data.summary1L || 0) + updates.summary1L;
          const newMasterPoints = (data.masterPoints || 0) + totalPointsEarned;

          update(userRef, {
            summaryGlass: newGlass,
            summaryPocket: newPocket,
            summary500ml: new500ml,
            summary1L: new1L,
            masterPoints: newMasterPoints,
            lastTransactionPoint: totalPointsEarned,
          }).then(() => {
            // Reset inputs
            products.forEach(p => document.getElementById(`${p}Qty`).value = 0);

            // Update display
            document.getElementById("memberTotalPoints").textContent = newMasterPoints;
            document.getElementById("memberGlass").textContent = newGlass;
            document.getElementById("memberPocket").textContent = newPocket;
            document.getElementById("member500ml").textContent = new500ml;
            document.getElementById("member1L").textContent = new1L;

            // Toast message
            showToast(`✅ Transaction saved for ${buyerName} — +Glass:${updates.summaryGlass}, Pocket:${updates.summaryPocket}, 500ml:${updates.summary500ml}, 1L:${updates.summary1L} — Total Points: ${newMasterPoints}`);
          });
        }
      });
    };

    // Animated toast
    window.showToast = function (msg) {
      let toast = document.createElement("div");
      toast.textContent = msg;
      toast.style.position = "fixed";
      toast.style.bottom = "-50px";
      toast.style.left = "50%";
      toast.style.transform = "translateX(-50%)";
      toast.style.background = "#333";
      toast.style.color = "#fff";
      toast.style.padding = "10px 20px";
      toast.style.borderRadius = "20px";
      toast.style.boxShadow = "0 2px 6px rgba(0,0,0,0.3)";
      toast.style.transition = "all 0.5s ease";
      toast.style.zIndex = "9999";
      document.body.appendChild(toast);

      setTimeout(() => (toast.style.bottom = "40px"), 100); // slide in
      setTimeout(() => (toast.style.opacity = "0"), 2800); // fade out
      setTimeout(() => toast.remove(), 3300);
    };
  </script>
</head>

<body>
  <div class="container">
    <h2>☕ Staff Transaction Panel</h2>
    <div class="welcome">Welcome, <b>Aji Saputra</b></div>

    <input id="searchInput" type="text" placeholder="Search member..." />
    <button onclick="searchMember()">Search</button>

    <div class="member-summary">
      <h3>👤 Member Summary</h3>
      <div>Name: <span id="buyerName">-</span></div>
      <div>Total Points: <span id="memberTotalPoints">0</span></div>
      <div>Glass: <span id="memberGlass">0</span> | Pocket: <span id="memberPocket">0</span></div>
      <div>500ml: <span id="member500ml">0</span> | 1L: <span id="member1L">0</span></div>
    </div>

    <hr />

    <div class="purchase-summary">
      <h3>🧾 Purchase Summary</h3>
      <div>Glass: <span id="purchaseGlass">0</span> | Pocket: <span id="purchasePocket">0</span></div>
      <div>500ml: <span id="purchase500ml">0</span> | 1L: <span id="purchase1L">0</span></div>
    </div>

    <hr />

    <div class="products">
      <h3>Select Items:</h3>

      <div>Copyaren <input id="copyarenQty" type="number" value="0" min="0" /> 
        <select id="copyarenSize">
          <option value="glass">Glass 175ml</option>
          <option value="pocket">Pocket 250ml</option>
          <option value="500ml">500ml</option>
          <option value="1l">1L</option>
        </select>
      </div>

      <div>Chocobara <input id="chocobaraQty" type="number" value="0" min="0" />
        <select id="chocobaraSize">
          <option value="glass">Glass 175ml</option>
          <option value="pocket">Pocket 250ml</option>
          <option value="500ml">500ml</option>
          <option value="1l">1L</option>
        </select>
      </div>

      <div>Camericano <input id="camericanoQty" type="number" value="0" min="0" />
        <select id="camericanoSize">
          <option value="glass">Glass 175ml</option>
          <option value="pocket">Pocket 250ml</option>
          <option value="500ml">500ml</option>
          <option value="1l">1L</option>
        </select>
      </div>
    </div>

    <button onclick="submitTransaction()">Submit Transaction</button>
  </div>
</body>
</html>
