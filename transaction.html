<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Transaction Entry</title>
  <script src="https://www.gstatic.com/firebasejs/10.12.3/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.3/firebase-database-compat.js"></script>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet" />
</head>

<body class="bg-yellow-50 flex justify-center items-center min-h-screen">
  <div class="bg-white rounded-2xl shadow-lg p-6 w-full max-w-2xl">
    <h2 class="text-center text-2xl font-bold text-yellow-800 mb-2">☕ Coffee Loyalty Transaction</h2>
    <p id="currentDateTime" class="text-center text-sm text-gray-500 mb-3"></p>

    <!-- Buyer Info -->
    <div class="mb-4 border p-3 rounded-lg bg-yellow-100">
      <p><strong>Buyer:</strong> <span id="buyerName">Loading...</span></p>
      <p><strong>ID:</strong> <span id="buyerId">-</span></p>
      <p><strong>Staff:</strong> <span id="staffName">Barista A</span></p>
    </div>

    <!-- Items Purchased -->
    <div class="mb-4">
      <h3 class="text-lg font-semibold text-yellow-800 mb-2">🧾 Purchased Items</h3>
      <textarea id="itemSummary" rows="3" class="w-full border p-2 rounded-md text-sm" placeholder="Example: CappYaren 175ml ×2, ChocoBara 500ml ×1, Americano 1L ×1"></textarea>
    </div>

    <!-- Payment Info -->
    <div class="grid grid-cols-2 gap-4 mb-4">
      <div>
        <label class="block text-sm font-medium text-gray-700">Payment Type</label>
        <select id="paymentType" class="w-full border rounded-md p-2">
          <option value="Cash">Cash</option>
          <option value="QRIS">QRIS</option>
          <option value="Transfer">Transfer</option>
        </select>
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700">Total Amount (Rp)</label>
        <input type="number" id="totalAmount" class="w-full border rounded-md p-2" placeholder="e.g., 25000" />
      </div>
    </div>

    <div class="grid grid-cols-2 gap-4 mb-4">
      <div>
        <label class="block text-sm font-medium text-gray-700">Paid Amount (Rp)</label>
        <input type="number" id="paidAmount" class="w-full border rounded-md p-2" placeholder="e.g., 30000" />
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700">Change (Rp)</label>
        <input type="number" id="changeAmount" class="w-full border rounded-md p-2 bg-gray-100" readonly />
      </div>
    </div>

    <!-- Points Summary -->
    <div class="bg-yellow-100 border border-yellow-300 rounded-xl p-3 mb-4 text-sm text-center">
      <p><strong>Points Earned:</strong> <span id="pointsEarned">0</span></p>
      <p><strong>Total Master Points:</strong> <span id="updatedMasterPoints">0</span></p>
      <p class="mt-1">
        Glass: <span id="summaryGlass">0</span> |
        Pocket: <span id="summaryPocket">0</span> |
        500ml: <span id="summary500ml">0</span> |
        1L: <span id="summary1L">0</span>
      </p>
    </div>

    <!-- Buttons -->
    <div class="flex justify-between">
      <button onclick="window.location.href='history.html'" class="bg-gray-400 hover:bg-gray-500 text-white px-4 py-2 rounded-xl">
        🔙 History
      </button>
      <button id="submitTransaction" class="bg-yellow-500 hover:bg-yellow-600 text-white px-4 py-2 rounded-xl font-semibold">
        ✅ Submit Transaction
      </button>
    </div>
  </div>

  <script>
    // 🔧 Firebase setup
    const firebaseConfig = {
      apiKey: "AIzaSyAWZg7mZe1j2Nwkg5JvPUjf_bdCvfWvN9g",
      authDomain: "kopi-copybara.firebaseapp.com",
      databaseURL: "https://kopi-copybara-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "kopi-copybara",
      storageBucket: "kopi-copybara.appspot.com",
      messagingSenderId: "729875984861",
      appId: "1:729875984861:web:6b1ea2d44f8789c18e4634"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    const buyerInfo = JSON.parse(localStorage.getItem("buyerInfo")) || {};
    const buyerId = buyerInfo.id || sessionStorage.getItem("buyerId");
    const buyerName = buyerInfo.name || sessionStorage.getItem("buyerName") || "Unknown Buyer";

    document.getElementById("buyerId").innerText = buyerId;
    document.getElementById("buyerName").innerText = buyerName;

    // 🕒 Live date-time
    function updateDateTime() {
      const now = new Date();
      document.getElementById("currentDateTime").textContent =
        now.toLocaleString("en-GB", {
          weekday: "short",
          year: "numeric",
          month: "short",
          day: "numeric",
          hour: "2-digit",
          minute: "2-digit",
          second: "2-digit"
        });
    }
    setInterval(updateDateTime, 1000);
    updateDateTime();

    // 🧮 Auto change calculator
    document.getElementById("paidAmount").addEventListener("input", () => {
      const total = parseFloat(document.getElementById("totalAmount").value) || 0;
      const paid = parseFloat(document.getElementById("paidAmount").value) || 0;
      document.getElementById("changeAmount").value = (paid - total >= 0) ? (paid - total).toFixed(0) : 0;
    });

    // ⚙️ Example points calculation (customize logic)
    function calculatePoints(total) {
      return Math.floor(total / 10000); // 1 point per 10,000
    }

    document.getElementById("totalAmount").addEventListener("input", () => {
      const total = parseFloat(document.getElementById("totalAmount").value) || 0;
      const points = calculatePoints(total);
      document.getElementById("pointsEarned").innerText = points;
      document.getElementById("updatedMasterPoints").innerText = points; // Later replace with buyer's total
    });

    // ✅ Submit transaction
    document.getElementById("submitTransaction").addEventListener("click", async () => {
      const itemSummary = document.getElementById("itemSummary").value.trim();
      const paymentType = document.getElementById("paymentType").value;
      const totalAmount = parseFloat(document.getElementById("totalAmount").value) || 0;
      const paidAmount = parseFloat(document.getElementById("paidAmount").value) || 0;
      const changeAmount = parseFloat(document.getElementById("changeAmount").value) || 0;
      const totalPointsEarned = parseInt(document.getElementById("pointsEarned").innerText);
      const updatedMasterPoints = parseInt(document.getElementById("updatedMasterPoints").innerText);
      const staffName = document.getElementById("staffName").innerText;

      if (!buyerId || !totalAmount || !itemSummary) {
        alert("⚠️ Please fill buyer info, items, and total amount.");
        return;
      }

      // Example current summary (later can be fetched dynamically)
      const summaryGlass = 2;
      const summaryPocket = 1;
      const summary500ml = 3;
      const summary1L = 1;

      const newTransaction = {
        buyerId,
        buyerName,
        dateTime: new Date().toLocaleString("en-GB"),
        paymentType,
        paidAmount,
        changeAmount,
        totalAmount,
        totalPointsEarned,
        updatedMasterPoints,
        summaryGlass,
        summaryPocket,
        summary500ml,
        summary1L,
        itemSummary,
        staff: staffName
      };

      await db.ref("transactions").push(newTransaction);

      alert("✅ Transaction saved successfully!");
      document.getElementById("itemSummary").value = "";
      document.getElementById("totalAmount").value = "";
      document.getElementById("paidAmount").value = "";
      document.getElementById("changeAmount").value = "";
      document.getElementById("pointsEarned").innerText = "0";
      document.getElementById("updatedMasterPoints").innerText = "0";
    });
  </script>
</body>
</html>
