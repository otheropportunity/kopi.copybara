<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Buyer History</title>
  <script src="https://www.gstatic.com/firebasejs/10.12.3/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.3/firebase-database-compat.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet" />
</head>
<body class="bg-yellow-50 flex justify-center items-center min-h-screen">
  <div class="bg-white rounded-2xl shadow-md p-6 w-full max-w-2xl">
    <h2 class="text-center text-2xl font-bold text-yellow-800 mb-2">🧾 Buyer Activity History</h2>
    <p class="text-center text-sm text-gray-500 mb-4">All purchase & redeem records</p>

    <div id="buyerSummary" class="bg-yellow-100 border border-yellow-300 rounded-xl p-3 mb-4 text-center text-sm">
      <p><span class="font-bold text-yellow-800">Buyer:</span> <span id="buyerName">Loading...</span></p>
      <p class="mt-1">
        <span class="font-bold text-yellow-800">Remaining Points:</span>
        <span id="pointsGlass">Glass: 0</span> |
        <span id="pointsPocket">Pocket: 0</span> |
        <span id="points500ml">500ml: 0</span> |
        <span id="points1l">1L: 0</span>
      </p>
      <p id="totalPoints" class="mt-1 font-semibold text-yellow-700">Total: 0 pts</p>
    </div>

    <!-- Filter & Download Buttons -->
    <div class="flex justify-between items-center mb-3">
      <div class="space-x-2">
        <button id="showAllBtn" class="bg-yellow-500 text-white px-3 py-1 rounded-lg hover:bg-yellow-600 text-sm font-semibold">Show All</button>
        <button id="showPurchaseBtn" class="bg-green-500 text-white px-3 py-1 rounded-lg hover:bg-green-600 text-sm font-semibold">Purchase</button>
        <button id="showRedeemBtn" class="bg-red-500 text-white px-3 py-1 rounded-lg hover:bg-red-600 text-sm font-semibold">Redeem</button>
      </div>
      <button id="downloadBtn" class="bg-blue-500 hover:bg-blue-600 text-white px-3 py-1 rounded-lg text-sm font-semibold">
        ⬇️ Download .xlsx
      </button>
    </div>

    <!-- Table -->
    <div class="overflow-x-auto">
      <table class="min-w-full border border-gray-300 text-sm text-gray-700">
        <thead class="bg-yellow-200 text-yellow-900">
          <tr>
            <th class="border px-2 py-1">Date</th>
            <th class="border px-2 py-1">Type</th>
            <th class="border px-2 py-1">Item</th>
            <th class="border px-2 py-1">Size</th>
            <th class="border px-2 py-1">Qty</th>
            <th class="border px-2 py-1">Points</th>
          </tr>
        </thead>
        <tbody id="historyBody" class="text-center bg-white">
          <tr><td colspan="6" class="py-3 text-gray-400">Loading...</td></tr>
        </tbody>
      </table>
    </div>

    <div class="mt-5 text-center">
      <button onclick="window.location.href='transaction.html'"
        class="bg-blue-500 hover:bg-blue-600 text-white py-2 px-4 rounded-xl">
        🔙 Back to Transaction
      </button>
    </div>
  </div>

  <script>
    // 🔥 Firebase Setup
    const firebaseConfig = {
      apiKey: "YOUR_API_KEY",
      authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
      databaseURL: "https://YOUR_PROJECT_ID-default-rtdb.firebaseio.com",
      projectId: "YOUR_PROJECT_ID",
      storageBucket: "YOUR_PROJECT_ID.appspot.com",
      messagingSenderId: "YOUR_SENDER_ID",
      appId: "YOUR_APP_ID"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    const buyerName = sessionStorage.getItem("buyerName") || "Unknown Buyer";
    document.getElementById("buyerName").innerText = buyerName;

    let allHistory = [];

    async function loadHistory() {
      const buyerId = sessionStorage.getItem("buyerId");
      if (!buyerId) {
        document.getElementById("historyBody").innerHTML = `<tr><td colspan="6" class="py-3 text-red-500">No buyer selected.</td></tr>`;
        return;
      }

      const buyerSnap = await db.ref(`buyers/${buyerId}`).get();
      const buyer = buyerSnap.val() || {};
      document.getElementById("pointsGlass").innerText = `Glass: ${buyer.glass || 0}`;
      document.getElementById("pointsPocket").innerText = `Pocket: ${buyer.pocket || 0}`;
      document.getElementById("points500ml").innerText = `500ml: ${buyer["500ml"] || 0}`;
      document.getElementById("points1l").innerText = `1L: ${buyer["1l"] || 0}`;
      const total = (buyer.glass || 0) + (buyer.pocket || 0) + (buyer["500ml"] || 0) + (buyer["1l"] || 0);
      document.getElementById("totalPoints").innerText = `Total: ${total} pts`;

      const transactionsSnap = await db.ref(`transactions`).orderByChild("buyerId").equalTo(buyerId).get();
      const redeemSnap = await db.ref(`redeemHistory`).orderByChild("buyerId").equalTo(buyerId).get();

      const history = [];

      if (transactionsSnap.exists()) {
        transactionsSnap.forEach((t) => {
          const data = t.val();
          history.push({
            date: data.date || "-",
            type: "Purchase",
            item: data.itemName || "-",
            size: data.size || "-",
            qty: data.quantity || 1,
            points: data.pointsEarned || 0,
          });
        });
      }

      if (redeemSnap.exists()) {
        redeemSnap.forEach((r) => {
          const data = r.val();
          history.push({
            date: data.date || "-",
            type: "Redeem",
            item: data.item || "-",
            size: data.size || "-",
            qty: data.quantity || 1,
            points: `-${data.pointsUsed || 0}`,
          });
        });
      }

      allHistory = history.sort((a, b) => new Date(b.date) - new Date(a.date));
      renderHistory(allHistory);
    }

    function renderHistory(list) {
      const tbody = document.getElementById("historyBody");
      if (list.length === 0) {
        tbody.innerHTML = `<tr><td colspan="6" class="py-3 text-gray-400">No history found.</td></tr>`;
        return;
      }
      tbody.innerHTML = list.map(h => `
        <tr class="${h.type === 'Redeem' ? 'bg-red-50' : 'bg-green-50'}">
          <td class="border px-2 py-1">${h.date}</td>
          <td class="border px-2 py-1 font-semibold ${h.type === 'Redeem' ? 'text-red-700' : 'text-green-700'}">${h.type}</td>
          <td class="border px-2 py-1">${h.item}</td>
          <td class="border px-2 py-1">${h.size}</td>
          <td class="border px-2 py-1">${h.qty}</td>
          <td class="border px-2 py-1">${h.points}</td>
        </tr>
      `).join("");
    }

    // 🔄 Filter Buttons
    document.getElementById("showAllBtn").onclick = () => renderHistory(allHistory);
    document.getElementById("showPurchaseBtn").onclick = () => renderHistory(allHistory.filter(h => h.type === "Purchase"));
    document.getElementById("showRedeemBtn").onclick = () => renderHistory(allHistory.filter(h => h.type === "Redeem"));

    // ⬇️ Download .xlsx
    document.getElementById("downloadBtn").onclick = () => {
      if (allHistory.length === 0) return alert("No data to export.");
      const ws = XLSX.utils.json_to_sheet(allHistory);
      const wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, ws, "History");
      XLSX.writeFile(wb, `${buyerName}_history.xlsx`);
    };

    loadHistory();
  </script>
</body>
</html>
