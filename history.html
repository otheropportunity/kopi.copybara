<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Coffee Loyalty - Transaction & Redeem History</title>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-amber-50 min-h-screen flex flex-col items-center p-6">

  <h1 class="text-3xl font-bold text-amber-800 mb-4">☕ Coffee Loyalty History</h1>

  <div class="w-full max-w-5xl bg-white shadow-md rounded-2xl p-4 mb-4">
    <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3">
      <div>
        <span class="text-sm text-gray-600">Logged in as:</span>
        <span id="staffName" class="font-semibold text-amber-700"></span>
      </div>

      <div class="flex gap-2">
        <input
          type="text"
          id="searchInput"
          placeholder="Search buyer..."
          class="border border-gray-300 rounded-lg px-3 py-1 w-48 focus:outline-none focus:ring-2 focus:ring-amber-500"
        />
        <select id="sortOption" class="border border-gray-300 rounded-lg px-3 py-1 focus:outline-none focus:ring-2 focus:ring-amber-500">
          <option value="date">Sort by Date</option>
          <option value="name">Sort by Name</option>
        </select>
        <button
          onclick="exportToExcel()"
          class="bg-green-600 hover:bg-green-700 text-white px-4 py-1 rounded-lg"
        >
          Export Excel
        </button>
      </div>
    </div>
  </div>

  <div class="w-full max-w-5xl bg-white shadow-lg rounded-2xl p-4 overflow-x-auto">
    <table class="w-full border-collapse">
      <thead class="bg-amber-600 text-white">
        <tr>
          <th class="py-2 px-3 text-left">Buyer</th>
          <th class="py-2 px-3 text-left">Product</th>
          <th class="py-2 px-3 text-left">Size</th>
          <th class="py-2 px-3 text-left">Points Used / Earned</th>
          <th class="py-2 px-3 text-left">Staff</th>
          <th class="py-2 px-3 text-left">Type</th>
          <th class="py-2 px-3 text-left">Timestamp</th>
        </tr>
      </thead>
      <tbody id="historyTable" class="divide-y divide-gray-200"></tbody>
    </table>
  </div>

  <script>
    // === Firebase Config ===
    const firebaseConfig = {
      apiKey: "AIzaSyD8gZ_fKEbT4PDXqJFe2BG2ps-Nw-sWNQI",
      authDomain: "kopi-copybara.firebaseapp.com",
      databaseURL: "https://kopi-copybara-default-rtdb.firebaseio.com/",
      projectId: "kopi-copybara",
      storageBucket: "kopi-copybara.appspot.com",
      messagingSenderId: "1051151399321",
      appId: "1:1051151399321:web:4dc153d2a2896ff7758e2a"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    const staffDisplay = document.getElementById("staffName");
    const historyTable = document.getElementById("historyTable");
    const searchInput = document.getElementById("searchInput");
    const sortOption = document.getElementById("sortOption");

    let combinedData = [];

    // === Load Staff Name ===
    const staffName = sessionStorage.getItem("staffName") || "Unknown";
    staffDisplay.textContent = staffName;

    // === Fetch Transactions & Redeem History ===
    async function loadData() {
      const [txSnap, redeemSnap] = await Promise.all([
        db.ref("transactions").once("value"),
        db.ref("redeemHistory").once("value")
      ]);

      combinedData = [];

      // --- Transactions ---
      txSnap.forEach(child => {
        const val = child.val();
        combinedData.push({
          buyer: val.buyer || "",
          product: val.product || "",
          size: val.size || "",
          points: val.pointsEarned || 0,
          staff: val.staff || "",
          type: "Purchase",
          timestamp: val.timestamp || ""
        });
      });

      // --- Redeem History ---
      redeemSnap.forEach(child => {
        const val = child.val();
        combinedData.push({
          buyer: val.buyer || "",
          product: val.product || "",
          size: val.size || "",
          points: val.pointsUsed || 0,
          staff: val.staff || "",
          type: val.usedType || "Redeem",
          timestamp: val.timestamp || ""
        });
      });

      renderTable();
    }

    // === Render Table ===
    function renderTable() {
      const keyword = searchInput.value.toLowerCase();
      const sortBy = sortOption.value;
      let filtered = combinedData.filter(item =>
        item.buyer.toLowerCase().includes(keyword)
      );

      if (sortBy === "date") {
        filtered.sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp));
      } else {
        filtered.sort((a, b) => a.buyer.localeCompare(b.buyer));
      }

      historyTable.innerHTML = filtered
        .map(
          (row) => `
          <tr class="hover:bg-amber-50">
            <td class="py-2 px-3">${row.buyer}</td>
            <td class="py-2 px-3">${row.product}</td>
            <td class="py-2 px-3">${row.size}</td>
            <td class="py-2 px-3 text-center">${row.points}</td>
            <td class="py-2 px-3">${row.staff}</td>
            <td class="py-2 px-3 font-semibold ${row.type === "Purchase" ? "text-green-600" : "text-red-600"}">${row.type}</td>
            <td class="py-2 px-3 text-sm text-gray-600">${row.timestamp}</td>
          </tr>
        `
        )
        .join("");
    }

    // === Excel Export ===
    function exportToExcel() {
      const keyword = searchInput.value.toLowerCase();
      const filtered = combinedData.filter(item =>
        item.buyer.toLowerCase().includes(keyword)
      );
      const ws = XLSX.utils.json_to_sheet(filtered);
      const wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, ws, "History");
      XLSX.writeFile(wb, "CoffeeLoyalty_History.xlsx");
    }

    searchInput.addEventListener("input", renderTable);
    sortOption.addEventListener("change", renderTable);

    loadData();
  </script>
</body>
</html>
