<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Coffee Loyalty - Transaction & Redemption History</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>

  <style>
    body { background-color: #fffaf0; font-family: 'Poppins', sans-serif; }
    .card { background: white; border-radius: 12px; padding: 24px; max-width: 1100px; margin: 40px auto; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
    th, td { text-align: left; padding: 10px; border-bottom: 1px solid #ddd; }
    th { cursor: pointer; }
  </style>
</head>

<body>
  <div class="card">
    <h1 class="text-2xl font-bold text-center text-amber-800 mb-4">
      ☕ Transaction & Redemption History
    </h1>

    <div class="flex justify-between items-center mb-4">
      <button onclick="window.location.href='transaction.html'" class="bg-amber-700 text-white p-2 px-4 rounded-lg hover:bg-amber-800 transition">
        ⬅ Back
      </button>
      <div class="flex items-center gap-2">
        <button id="sortButton" class="bg-amber-600 text-white p-2 px-4 rounded-lg hover:bg-amber-700 transition">
          🔤 Sort by Name
        </button>
        <span id="staffNameDisplay" class="font-semibold text-amber-700"></span>
      </div>
    </div>

    <div class="overflow-x-auto">
      <table class="min-w-full bg-white rounded-lg">
        <thead class="bg-amber-700 text-white">
          <tr>
            <th>Date/Time</th>
            <th>Buyer Name</th>
            <th>Items</th>
            <th>Points Earned</th>
            <th>Redeemed (pts)</th>
            <th>Staff</th>
          </tr>
        </thead>
        <tbody id="historyTable" class="text-sm"></tbody>
      </table>
    </div>
  </div>

  <script>
    // === Firebase config ===
    const firebaseConfig = {
      apiKey: "AIzaSyAWZg7mZe1j2Nwkg5JvPUjf_bdCvfWvN9g",
      authDomain: "kopi-copybara.firebaseapp.com",
      databaseURL: "https://kopi-copybara-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "kopi-copybara",
      storageBucket: "kopi-copybara.appspot.com",
      messagingSenderId: "729875984861",
      appId: "1:729875984861:web:6b1ea2d44f8789c18e4634"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let historyRows = [];
    let sortByName = false;

    document.addEventListener("DOMContentLoaded", () => {
      const staffName = sessionStorage.getItem("staffName");
      if (!staffName || staffName === "null") {
        alert("Session expired or not logged in. Please login as staff.");
        window.location.href = "index.html";
        return;
      }
      document.getElementById("staffNameDisplay").textContent = "Logged in as: " + staffName;

      loadHistory();

      document.getElementById("sortButton").addEventListener("click", () => {
        sortByName = !sortByName;
        renderHistory();
        document.getElementById("sortButton").textContent = sortByName ? "📅 Sort by Date" : "🔤 Sort by Name";
      });
    });

    async function loadHistory() {
      const historyTable = document.getElementById("historyTable");
      historyTable.innerHTML = `<tr><td colspan="6" class="text-center py-4 text-gray-500">Loading...</td></tr>`;

      const [transactionsSnap, redemptionsSnap] = await Promise.all([
        db.ref("transactions").once("value"),
        db.ref("redemptions").once("value")
      ]);

      historyRows = [];

      // 🟤 Transactions
      transactionsSnap.forEach(child => {
        const t = child.val();
        if (!t.buyerName) return;
        const itemList = Object.entries(t.items || {})
          .filter(([_, q]) => q > 0)
          .map(([name, q]) => `${name} (${q})`)
          .join(", ") || "-";

        historyRows.push({
          dateTime: t.dateTime || "-",
          buyerName: t.buyerName,
          items: itemList,
          points: t.totalPointsEarned || 0,
          redeem: "-",
          staff: t.staff || "-"
        });
      });

      // 🟤 Redemptions
      redemptionsSnap.forEach(child => {
        const r = child.val();
        if (!r.buyerName) return;
        historyRows.push({
          dateTime: r.dateTime || "-",
          buyerName: r.buyerName,
          items: `🎁 Redeemed: ${r.itemName || r.item || "-"}`,
          points: "-",
          redeem: r.pointsUsed || 0,
          staff: r.staff || "-"
        });
      });

      renderHistory();
    }

    function renderHistory() {
      const historyTable = document.getElementById("historyTable");

      if (sortByName) {
        // Sort by buyerName (A-Z), then by date (latest first)
        historyRows.sort((a, b) => {
          const nameA = a.buyerName.toLowerCase();
          const nameB = b.buyerName.toLowerCase();
          if (nameA < nameB) return -1;
          if (nameA > nameB) return 1;
          return new Date(b.dateTime) - new Date(a.dateTime);
        });
      } else {
        // Sort by date (latest first)
        historyRows.sort((a, b) => new Date(b.dateTime) - new Date(a.dateTime));
      }

      if (historyRows.length === 0) {
        historyTable.innerHTML = `<tr><td colspan="6" class="text-center py-4 text-gray-500">No transactions or redemptions found.</td></tr>`;
        return;
      }

      historyTable.innerHTML = historyRows.map(r => `
        <tr class="hover:bg-amber-50">
          <td>${r.dateTime}</td>
          <td>${r.buyerName}</td>
          <td>${r.items}</td>
          <td>${r.points}</td>
          <td>${r.redeem}</td>
          <td>${r.staff}</td>
        </tr>
      `).join("");
    }
  </script>
</body>
</html>
