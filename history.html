<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Coffee Loyalty - Transaction & Redemption History</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

  <style>
    body { background-color: #fffaf0; font-family: 'Poppins', sans-serif; }
    .card { background: white; border-radius: 12px; padding: 24px; max-width: 1200px; margin: 40px auto; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
    th, td { text-align: left; padding: 10px; border-bottom: 1px solid #ddd; }
    th { cursor: pointer; }
    .hover-row:hover { background-color: #fef3c7; }
  </style>
</head>

<body>
  <div class="card">
    <h1 class="text-2xl font-bold text-center text-amber-800 mb-4">
      ☕ Transaction & Redemption History
    </h1>

    <div class="flex justify-between items-center mb-4 flex-wrap gap-2">
      <button onclick="window.location.href='transaction.html'" class="bg-amber-700 text-white p-2 px-4 rounded-lg hover:bg-amber-800 transition">
        ⬅ Back
      </button>

      <div class="flex items-center gap-2 flex-wrap">
        <button id="sortButton" class="bg-amber-600 text-white p-2 px-4 rounded-lg hover:bg-amber-700 transition">
          🔤 Sort by Name
        </button>

        <button id="downloadExcel" class="bg-green-600 text-white p-2 px-4 rounded-lg hover:bg-green-700 transition">
          ⬇️ Download Excel
        </button>

        <span id="staffNameDisplay" class="font-semibold text-amber-700"></span>
      </div>
    </div>

    <div class="overflow-x-auto">
      <table class="min-w-full bg-white rounded-lg text-sm">
        <thead class="bg-amber-700 text-white">
          <tr>
            <th>Date/Time</th>
            <th>Buyer Name</th>
            <th>Items (Qty & Size)</th>
            <th>Total (Rp)</th>
            <th>Payment</th>
            <th>Paid (Rp)</th>
            <th>Change (Rp)</th>
            <th>Points Earned</th>
            <th>Redeemed (pts)</th>
            <th>Remaining Points</th>
            <th>Staff</th>
          </tr>
        </thead>
        <tbody id="historyTable"></tbody>
      </table>
    </div>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyAWZg7mZe1j2Nwkg5JvPUjf_bdCvfWvN9g",
      authDomain: "kopi-copybara.firebaseapp.com",
      databaseURL: "https://kopi-copybara-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "kopi-copybara",
      storageBucket: "kopi-copybara.appspot.com",
      messagingSenderId: "729875984861",
      appId: "1:729875984861:web:6b1ea2d44f8789c18e4634"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let historyRows = [];
    let sortByName = false;

    document.addEventListener("DOMContentLoaded", () => {
      const staffName = sessionStorage.getItem("staffName");
      if (!staffName || staffName === "null") {
        alert("Session expired or not logged in. Please login again.");
        window.location.href = "index.html";
        return;
      }
      document.getElementById("staffNameDisplay").textContent = "Logged in as: " + staffName;

      loadHistory();

      document.getElementById("sortButton").addEventListener("click", () => {
        sortByName = !sortByName;
        renderHistory();
        document.getElementById("sortButton").textContent = sortByName ? "📅 Sort by Date" : "🔤 Sort by Name";
      });

      document.getElementById("downloadExcel").addEventListener("click", downloadExcel);
    });

    function formatItems(transaction) {
      const items = [];
      if (transaction.copyarenQty && transaction.copyarenQty > 0) {
        items.push(`Copyaren ${transaction.copyarenSize || ""}ml × ${transaction.copyarenQty}`);
      }
      if (transaction.chocobaraQty && transaction.chocobaraQty > 0) {
        items.push(`Chocobara ${transaction.chocobaraSize || ""}ml × ${transaction.chocobaraQty}`);
      }
      if (transaction.camericanoQty && transaction.camericanoQty > 0) {
        items.push(`Camericano ${transaction.camericanoSize || ""}ml × ${transaction.camericanoQty}`);
      }
      return items.length > 0 ? items.join(", ") : (transaction.itemName || "-");
    }

    async function loadHistory() {
      const table = document.getElementById("historyTable");
      table.innerHTML = `<tr><td colspan="11" class="text-center py-4 text-gray-500">Loading...</td></tr>`;

      const [transactionsSnap, redemptionsSnap] = await Promise.all([
        db.ref("transactions").once("value"),
        db.ref("redemptions").once("value")
      ]);

      historyRows = [];

      // Transactions (Points Earned)
      transactionsSnap.forEach(child => {
        const t = child.val();
        if (!t || !t.buyerName) return;

        historyRows.push({
          dateTime: t.dateTime || "-",
          buyerName: t.buyerName,
          items: formatItems(t),
          totalAmount: t.totalAmount || 0,
          paymentType: t.paymentType || "-",
          paidAmount: t.paidAmount || 0,
          changeAmount: t.changeAmount || 0,
          points: t.totalPointsEarned || 0,
          redeem: "-",
          remainingPoints: "-",
          staff: t.staff || "-"
        });
      });

      // Redemptions (Points Used)
      redemptionsSnap.forEach(child => {
        const r = child.val();
        if (!r) return;

        const buyer = r.buyerName || r.name || "Unknown";
        const itemName = r.itemName || r.reward || "-";
        const redeemPoints = r.totalPointsUsed || r.pointsUsed || r.points || 0;
        const date = r.dateTime || r.timestamp || "-";
        const staff = r.staff || "-";

        historyRows.push({
          dateTime: date,
          buyerName: buyer,
          items: itemName,
          totalAmount: "-",
          paymentType: "-",
          paidAmount: "-",
          changeAmount: "-",
          points: "-",
          redeem: redeemPoints,
          remainingPoints: "-",
          staff: staff
        });
      });

      // Fetch remaining points for all buyers
      const buyerIds = [...new Set(historyRows.map(r => r.buyerName))];
      const promises = buyerIds.map(name =>
        db.ref("buyers").orderByChild("name").equalTo(name).once("value")
          .then(snap => {
            const val = snap.val();
            return { name, points: val ? Object.values(val)[0].points || 0 : 0 };
          })
      );

      const members = await Promise.all(promises);
      const pointsMap = {};
      members.forEach(m => pointsMap[m.name] = m.points);

      historyRows = historyRows.map(r => ({
        ...r,
        remainingPoints: pointsMap[r.buyerName] ?? "-"
      }));

      renderHistory();
    }

    function renderHistory() {
      const table = document.getElementById("historyTable");

      if (sortByName) {
        historyRows.sort((a, b) => (a.buyerName || "").localeCompare(b.buyerName || ""));
      } else {
        historyRows.sort((a, b) => new Date(b.dateTime) - new Date(a.dateTime));
      }

      if (historyRows.length === 0) {
        table.innerHTML = `<tr><td colspan="11" class="text-center py-4 text-gray-500">No data found.</td></tr>`;
        return;
      }

      table.innerHTML = historyRows.map(r => `
        <tr class="hover-row">
          <td>${r.dateTime}</td>
          <td>${r.buyerName}</td>
          <td>${r.items}</td>
          <td>${r.totalAmount !== "-" ? "Rp " + Number(r.totalAmount).toLocaleString() : "-"}</td>
          <td>${r.paymentType}</td>
          <td>${r.paidAmount !== "-" ? "Rp " + Number(r.paidAmount).toLocaleString() : "-"}</td>
          <td>${r.changeAmount !== "-" ? "Rp " + Number(r.changeAmount).toLocaleString() : "-"}</td>
          <td>${r.points}</td>
          <td>${r.redeem !== "-" ? r.redeem + " pts" : "-"}</td>
          <td>${r.remainingPoints}</td>
          <td>${r.staff}</td>
        </tr>
      `).join("");
    }

    function downloadExcel() {
      if (historyRows.length === 0) {
        alert("No data to export!");
        return;
      }

      const wsData = [
        ["Date/Time", "Buyer Name", "Items", "Total (Rp)", "Payment", "Paid (Rp)", "Change (Rp)", "Points Earned", "Redeemed (pts)", "Remaining Points", "Staff"],
        ...historyRows.map(r => [
          r.dateTime,
          r.buyerName,
          r.items,
          r.totalAmount === "-" ? "" : r.totalAmount,
          r.paymentType,
          r.paidAmount === "-" ? "" : r.paidAmount,
          r.changeAmount === "-" ? "" : r.changeAmount,
          r.points === "-" ? "" : r.points,
          r.redeem === "-" ? "" : r.redeem,
          r.remainingPoints,
          r.staff
        ])
      ];

      const wb = XLSX.utils.book_new();
      const ws = XLSX.utils.aoa_to_sheet(wsData);
      XLSX.utils.book_append_sheet(wb, ws, "History");

      const now = new Date();
      const fileName = `Coffee_History_${now.getFullYear()}-${now.getMonth()+1}-${now.getDate()}.xlsx`;

      XLSX.writeFile(wb, fileName);
    }
  </script>
</body>
</html>
