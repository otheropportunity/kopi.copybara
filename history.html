<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Coffee Loyalty - Transaction & Redemption History</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

  <style>
    body { background-color: #fffaf0; font-family: 'Poppins', sans-serif; }
    .card { background: white; border-radius: 12px; padding: 24px; max-width: 1200px; margin: 40px auto; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
    th, td { text-align: left; padding: 10px; border-bottom: 1px solid #ddd; }
    th { cursor: pointer; }
  </style>
</head>

<body>
<div class="card">
  <div class="flex justify-between items-center mb-4 flex-wrap gap-2">
    <h1 class="text-2xl font-bold text-amber-800">☕ Transaction & Redemption History</h1>
    <div id="clock" class="text-lg font-semibold text-amber-700"></div>
  </div>

  <div class="flex justify-between items-center mb-4 flex-wrap gap-2">
    <button onclick="window.location.href='transaction.html'" class="bg-amber-700 text-white p-2 px-4 rounded-lg hover:bg-amber-800 transition">
      ⬅ Back
    </button>

    <div class="flex items-center gap-4 flex-wrap">
      <button id="sortButton" class="bg-amber-600 text-white p-2 px-4 rounded-lg hover:bg-amber-700 transition">
        🔤 Sort by Name
      </button>

      <button id="downloadExcel" class="bg-green-600 text-white p-2 px-4 rounded-lg hover:bg-green-700 transition">
        ⬇️ Download Excel
      </button>

      <span id="staffNameDisplay" class="font-semibold text-amber-700"></span>
    </div>
  </div>

  <!-- 🔍 Search box for buyer name -->
  <div style="margin: 10px 0; text-align: right;">
    <input type="text" id="buyerSearch" placeholder="Search Buyer Name..."
           style="padding:6px; border-radius:6px; border:1px solid #ccc; width:220px;">
  </div>

  <div class="overflow-x-auto">
    <table class="min-w-full bg-white rounded-lg text-sm">
      <thead class="bg-amber-700 text-white">
        <tr>
          <th>Date/Time</th>
          <th>Buyer Name</th>
          <th>Items</th>
          <th>Total (Rp)</th>
          <th>Payment</th>
          <th>Paid (Rp)</th>
          <th>Change (Rp)</th>
          <th>Points Earned</th>
          <th>Remaining Points</th>
          <th>Staff</th>
        </tr>
      </thead>
      <tbody id="historyTable"></tbody>
    </table>
  </div>
</div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyAWZg7mZe1j2Nwkg5JvPUjf_bdCvfWvN9g",
  authDomain: "kopi-copybara.firebaseapp.com",
  databaseURL: "https://kopi-copybara-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "kopi-copybara",
  storageBucket: "kopi-copybara.appspot.com",
  messagingSenderId: "729875984861",
  appId: "1:729875984861:web:6b1ea2d44f8789c18e4634"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

let transactionsData = [];
let sortByName = false;

document.addEventListener("DOMContentLoaded", async () => {
  const staffName = sessionStorage.getItem("staffName");
  if (!staffName || staffName === "null") {
    alert("Session expired or not logged in. Please login again.");
    window.location.href = "index.html";
    return;
  }
  document.getElementById("staffNameDisplay").textContent = "Logged in as: " + staffName;

  startClock();
  loadTransactions();

  document.getElementById("sortButton").addEventListener("click", () => {
    sortByName = !sortByName;
    renderTransactions();
    document.getElementById("sortButton").textContent = sortByName ? "📅 Sort by Date" : "🔤 Sort by Name";
  });

  document.getElementById("downloadExcel").addEventListener("click", downloadExcel);

  // 🔍 Add live search filter
  document.getElementById("buyerSearch").addEventListener("keyup", function() {
    const filter = this.value.toLowerCase();
    const rows = document.querySelectorAll("#historyTable tr");
    rows.forEach(row => {
      const buyerName = row.cells[1]?.innerText.toLowerCase() || "";
      row.style.display = buyerName.includes(filter) ? "" : "none";
    });
  });
});

// 🕒 Real-time clock on top
function startClock(){
  const clock=document.getElementById("clock");
  setInterval(()=>{
    const now=new Date();
    clock.textContent=now.toLocaleString('en-GB',{hour12:false});
  },1000);
}

// 🔹 Load Transactions from Firebase
async function loadTransactions(){
  const table=document.getElementById("historyTable");
  table.innerHTML=`<tr><td colspan="10" class="text-center py-4 text-gray-500">Loading...</td></tr>`;

  const snap=await db.ref("transactions").once("value");
  transactionsData=[];

  snap.forEach(child=>{
    const t=child.val();
    if(!t || !t.buyerName) return;

    // ✅ Use 'items' field if available; otherwise, fallback to summaries
    let itemsValue = "-";
    if (t.items && t.items.trim() !== "") {
      itemsValue = t.items;
    } else {
      const itemsSummary = [];
      if(t.summaryGlass>0) itemsSummary.push(`Glass (${t.summaryGlass})`);
      if(t.summaryPocket>0) itemsSummary.push(`Pocket (${t.summaryPocket})`);
      if(t.summary500ml>0) itemsSummary.push(`500ml (${t.summary500ml})`);
      if(t.summary1L>0) itemsSummary.push(`1L (${t.summary1L})`);
      if(itemsSummary.length>0) itemsValue = itemsSummary.join(", ");
    }

    transactionsData.push({
      dateTime: t.dateTime || "-",
      buyerName: t.buyerName || "-",
      items: itemsValue,
      totalAmount: t.totalAmount || 0,
      paymentType: t.paymentType || "-",
      paidAmount: t.paidAmount || 0,
      changeAmount: t.changeAmount || 0,
      totalPointsEarned: t.totalPointsEarned || 0,
      updatedMasterPoints: t.updatedMasterPoints || 0,
      staff: t.staff || "-"
    });
  });

  transactionsData.sort((a,b)=> new Date(b.dateTime) - new Date(a.dateTime));
  renderTransactions();
}

function renderTransactions(){
  const table=document.getElementById("historyTable");
  if(transactionsData.length===0){
    table.innerHTML=`<tr><td colspan="10" class="text-center py-4 text-gray-500">No transaction data found.</td></tr>`;
    return;
  }

  if(sortByName) transactionsData.sort((a,b)=>(a.buyerName||"").localeCompare(b.buyerName||""));

  table.innerHTML=transactionsData.map(t=>`
    <tr class="hover:bg-amber-50">
      <td>${t.dateTime}</td>
      <td>${t.buyerName}</td>
      <td>${t.items}</td>
      <td>Rp ${Number(t.totalAmount).toLocaleString()}</td>
      <td>${t.paymentType}</td>
      <td>Rp ${Number(t.paidAmount).toLocaleString()}</td>
      <td>Rp ${Number(t.changeAmount).toLocaleString()}</td>
      <td>${t.totalPointsEarned}</td>
      <td class="font-semibold text-amber-700">${t.updatedMasterPoints}</td>
      <td>${t.staff}</td>
    </tr>
  `).join("");
}

// ✅ Export to Excel
function downloadExcel(){
  if(transactionsData.length===0){alert("No data to export!");return;}
  const wsData=[["Date/Time","Buyer Name","Items","Total (Rp)","Payment","Paid (Rp)","Change (Rp)","Points Earned","Remaining Points","Staff"],
    ...transactionsData.map(t=>[
      t.dateTime,t.buyerName,t.items,t.totalAmount,
      t.paymentType,t.paidAmount,t.changeAmount,
      t.totalPointsEarned,t.updatedMasterPoints,t.staff
    ])
  ];
  const wb=XLSX.utils.book_new();
  const ws=XLSX.utils.aoa_to_sheet(wsData);
  XLSX.utils.book_append_sheet(wb,ws,"Transactions");
  const now=new Date();
  XLSX.writeFile(wb,`Coffee_Transactions_${now.getFullYear()}-${now.getMonth()+1}-${now.getDate()}.xlsx`);
}
</script>
</body>
</html>
