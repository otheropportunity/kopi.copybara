<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Coffee Loyalty - Transaction & Redemption History</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <style>
    body { background-color: #fffaf0; font-family: 'Poppins', sans-serif; }
    .card { background: white; border-radius: 12px; padding: 24px; max-width: 1200px; margin: 40px auto; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
    th, td { text-align: left; padding: 10px; border-bottom: 1px solid #ddd; }
    th { cursor: pointer; }
    .redeem-row { background-color: #d1fae5; font-style: italic; } /* Light green + italic */
  </style>
</head>

<body>
<div class="card">
  <h1 class="text-2xl font-bold text-center text-amber-800 mb-4">
    ☕ Transaction & Redemption History
  </h1>

  <div class="flex justify-between items-center mb-4 flex-wrap gap-2">
    <button onclick="window.location.href='transaction.html'" class="bg-amber-700 text-white p-2 px-4 rounded-lg hover:bg-amber-800 transition">
      ⬅ Back
    </button>

    <div class="flex items-center gap-4 flex-wrap">
      <span id="totalPointsDisplay" class="font-bold text-amber-800 text-lg">Loading points...</span>

      <input id="searchInput" type="text" placeholder="🔍 Search buyer name..."
        class="border border-amber-400 rounded-lg p-2 text-sm w-48 focus:outline-none focus:ring-2 focus:ring-amber-500"/>

      <button id="sortButton" class="bg-amber-600 text-white p-2 px-4 rounded-lg hover:bg-amber-700 transition">
        🔤 Sort by Name
      </button>

      <button id="downloadExcel" class="bg-green-600 text-white p-2 px-4 rounded-lg hover:bg-green-700 transition">
        ⬇️ Download Excel
      </button>

      <span id="staffNameDisplay" class="font-semibold text-amber-700"></span>
    </div>
  </div>

  <div class="overflow-x-auto">
    <table id="historyTable" class="min-w-full bg-white rounded-lg text-sm">
      <thead class="bg-amber-700 text-white">
        <tr>
          <th>Date/Time</th>
          <th>Buyer Name</th>
          <th>Items (Qty & Size)</th>
          <th>Total (Rp)</th>
          <th>Payment</th>
          <th>Paid (Rp)</th>
          <th>Change (Rp)</th>
          <th>Points Earned</th>
          <th>Redeemed (pts)</th>
          <th>Remaining Points</th>
          <th>Staff</th>
        </tr>
      </thead>
      <tbody id="historyBody"></tbody>
    </table>
  </div>
</div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyAWZg7mZe1j2Nwkg5JvPUjf_bdCvfWvN9g",
  authDomain: "kopi-copybara.firebaseapp.com",
  databaseURL: "https://kopi-copybara-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "kopi-copybara",
  storageBucket: "kopi-copybara.appspot.com",
  messagingSenderId: "729875984861",
  appId: "1:729875984861:web:6b1ea2d44f8789c18e4634"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

let historyRows = [];
let filteredRows = [];
let sortByName = false;

document.addEventListener("DOMContentLoaded", async () => {
  const staffName = sessionStorage.getItem("staffName");
  if (!staffName || staffName === "null") {
    alert("Session expired or not logged in. Please login again.");
    window.location.href = "index.html";
    return;
  }
  document.getElementById("staffNameDisplay").textContent = "Logged in as: " + staffName;

  await loadHistory();

  document.getElementById("sortButton").addEventListener("click", () => {
    sortByName = !sortByName;
    renderHistory();
    document.getElementById("sortButton").textContent = sortByName ? "📅 Sort by Date" : "🔤 Sort by Name";
  });

  document.getElementById("downloadExcel").addEventListener("click", downloadFilteredExcel);
  document.getElementById("searchInput").addEventListener("input", (e) => {
    const keyword = e.target.value.toLowerCase();
    filteredRows = historyRows.filter(r => (r.buyerName || "").toLowerCase().includes(keyword));
    renderHistory();
  });
});

async function loadHistory() {
  const table = document.getElementById("historyBody");
  table.innerHTML = `<tr><td colspan="11" class="text-center py-4 text-gray-500">Loading...</td></tr>`;

  const [transactionsSnap, redeemSnap] = await Promise.all([
    db.ref("transactions").once("value"),
    db.ref("redeemHistory").once("value")
  ]);

  let rawRows = [];

  // 🟢 Transactions
  transactionsSnap.forEach(child => {
    const t = child.val();
    if (!t || !t.buyerName) return;
    rawRows.push({
      dateTime: t.dateTime || "-",
      buyerName: t.buyerName,
      items: t.items || "-",
      totalAmount: t.totalAmount || 0,
      paymentType: t.paymentType || "-",
      paidAmount: t.paidAmount || 0,
      changeAmount: t.changeAmount || 0,
      pointsEarned: t.totalPointEarned || 0,
      redeemed: 0,
      remainingPoints: t.UpdateMasterPoints || 0,
      staff: t.staff || "-",
      isRedeem: false
    });
  });

  // 🔸 Redeem History
  redeemSnap.forEach(child => {
    const r = child.val();
    if (!r || !r.buyer) return;
    const desc = `${r.product || '-'} ${r.size || '-'} (${r.usedType || '-'})`;
    rawRows.push({
      dateTime: r.timestamp ? new Date(r.timestamp).toLocaleString() : "-",
      buyerName: r.buyer,
      items: desc,
      totalAmount: "-",
      paymentType: "REDEEM",
      paidAmount: "-",
      changeAmount: "-",
      pointsEarned: 0,
      redeemed: r.pointsUsed || 0,
      remainingPoints: "-",
      staff: r.staff || "-",
      isRedeem: true
    });
  });

  historyRows = rawRows.sort((a,b) => new Date(b.dateTime) - new Date(a.dateTime));
  filteredRows = [...historyRows];
  document.getElementById("totalPointsDisplay").textContent = "⭐ History Loaded ("+historyRows.length+" entries)";
  renderHistory();
}

function renderHistory() {
  const table = document.getElementById("historyBody");
  const rows = filteredRows.length ? filteredRows : historyRows;

  if (rows.length === 0) {
    table.innerHTML = `<tr><td colspan="11" class="text-center py-4 text-gray-500">No data found.</td></tr>`;
    return;
  }

  const sorted = sortByName ? [...rows].sort((a,b)=>(a.buyerName||"").localeCompare(b.buyerName||"")) : rows;

  table.innerHTML = sorted.map(r => `
    <tr class="hover:bg-amber-50 ${r.isRedeem ? 'redeem-row' : ''}">
      <td>${r.dateTime}</td>
      <td>${r.buyerName}</td>
      <td>${r.items}</td>
      <td>${r.totalAmount!=="-"?"Rp "+Number(r.totalAmount).toLocaleString():"-"}</td>
      <td>${r.paymentType}</td>
      <td>${r.paidAmount!=="-"?"Rp "+Number(r.paidAmount).toLocaleString():"-"}</td>
      <td>${r.changeAmount!=="-"?"Rp "+Number(r.changeAmount).toLocaleString():"-"}</td>
      <td>${r.pointsEarned||"-"}</td>
      <td>${r.redeemed?r.redeemed+" pts":"-"}</td>
      <td class="font-semibold text-amber-700">${r.remainingPoints}</td>
      <td>${r.staff}</td>
    </tr>
  `).join("");
}

// ✅ Download only visible (filtered) rows
function downloadFilteredExcel() {
  const exportRows = filteredRows.length ? filteredRows : historyRows;
  if (exportRows.length === 0) {
    alert("No data to export!");
    return;
  }

  const wsData = [
    ["Date/Time","Buyer Name","Items","Total (Rp)","Payment","Paid (Rp)","Change (Rp)","Points Earned","Redeemed (pts)","Remaining Points","Staff"],
    ...exportRows.map(r => [
      r.dateTime, r.buyerName, r.items,
      r.totalAmount === "-" ? "" : r.totalAmount,
      r.paymentType,
      r.paidAmount === "-" ? "" : r.paidAmount,
      r.changeAmount === "-" ? "" : r.changeAmount,
      r.pointsEarned || "",
      r.redeemed || "",
      r.remainingPoints,
      r.staff
    ])
  ];

  const wb = XLSX.utils.book_new();
  const ws = XLSX.utils.aoa_to_sheet(wsData);
  XLSX.utils.book_append_sheet(wb, ws, "Filtered History");
  const now = new Date();
  XLSX.writeFile(wb, `Coffee_History_${now.getFullYear()}-${now.getMonth()+1}-${now.getDate()}.xlsx`);
}
</script>
</body>
</html>
