<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Coffee Loyalty - History</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
  <style>
    body { background-color: #fffaf0; font-family: 'Poppins', sans-serif; }
    .card { background: white; border-radius: 12px; padding: 24px; max-width: 900px; margin: 40px auto; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
    th { background-color: #fef3c7; color: #78350f; font-weight: 600; }
    tr:nth-child(even) { background-color: #fefce8; }
    #toast {
      position: fixed;
      bottom: -100px;
      left: 50%;
      transform: translateX(-50%);
      background-color: #16a34a;
      color: white;
      padding: 12px 24px;
      border-radius: 8px;
      font-size: 14px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
      opacity: 0;
      transition: all 0.5s ease;
      z-index: 1000;
    }
    #toast.show { bottom: 30px; opacity: 1; }
  </style>
</head>
<body>

  <!-- ✅ Toast -->
  <div id="toast"></div>

  <div class="card">
    <h1 class="text-2xl font-bold text-center text-amber-800 mb-4">📜 Transaction & Redeem History</h1>

    <div class="overflow-x-auto">
      <table class="w-full border-collapse text-sm text-center">
        <thead>
          <tr>
            <th class="p-2 border">Date / Time</th>
            <th class="p-2 border">Type</th>
            <th class="p-2 border">Buyer</th>
            <th class="p-2 border">Item / Product</th>
            <th class="p-2 border">Points (+/-)</th>
            <th class="p-2 border">Remaining Points</th>
            <th class="p-2 border">Staff</th>
          </tr>
        </thead>
        <tbody id="historyBody"></tbody>
      </table>
    </div>

    <button onclick="goBack()" class="w-full mt-5 bg-gray-300 text-gray-800 p-2 rounded-lg hover:bg-gray-400">⬅️ Back</button>
  </div>

  <script>
    // === Firebase Config ===
    const firebaseConfig = {
      apiKey: "AIzaSyAWZg7mZe1j2Nwkg5JvPUjf_bdCvfWvN9g",
      authDomain: "kopi-copybara.firebaseapp.com",
      databaseURL: "https://kopi-copybara-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "kopi-copybara",
      storageBucket: "kopi-copybara.appspot.com",
      messagingSenderId: "729875984861",
      appId: "1:729875984861:web:6b1ea2d44f8789c18e4634"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    // === Toast Function ===
    function showToast(msg, type="success") {
      const toast = document.getElementById("toast");
      const colors = {
        success: "#16a34a",
        error: "#dc2626",
        info: "#f59e0b"
      };
      toast.style.backgroundColor = colors[type] || "#16a34a";
      toast.textContent = msg;
      toast.classList.add("show");
      setTimeout(()=>toast.classList.remove("show"), 3000);
    }

    // === Load Data ===
    document.addEventListener("DOMContentLoaded", async () => {
      try {
        const transactionsSnap = await db.ref("transactions").once("value");
        const redeemSnap = await db.ref("redeemHistory").once("value");

        const allData = [];

        // 🟤 Parse Transactions
        transactionsSnap.forEach(t => {
          const val = t.val();
          allData.push({
            type: "Transaction",
            buyer: val.buyerName || "-",
            item: val.item || "-",
            points: val.pointsEarned ? `+${val.pointsEarned}` : "+0",
            remaining: val.remainingPoints || val.masterPoints || "-",
            staff: val.staff || "Unknown",
            timestamp: val.timestamp || new Date().toISOString()
          });
        });

        // 🟣 Parse Redeem History
        redeemSnap.forEach(r => {
          const val = r.val();
          allData.push({
            type: "Redeem",
            buyer: val.buyer || "-",
            item: `${val.product} (${val.size})`,
            points: val.pointsUsed ? `-${val.pointsUsed}` : "-0",
            remaining: "-", // optional: can update if stored
            staff: val.staff || "Unknown",
            timestamp: val.timestamp || new Date().toISOString()
          });
        });

        // 🟢 Sort newest first
        allData.sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp));

        const body = document.getElementById("historyBody");
        if (allData.length === 0) {
          body.innerHTML = `<tr><td colspan="7" class="p-3 text-gray-500 italic">No records found</td></tr>`;
          showToast("No history data found", "info");
          return;
        }

        allData.forEach(row => {
          const tr = document.createElement("tr");
          tr.innerHTML = `
            <td class="border p-2">${new Date(row.timestamp).toLocaleString()}</td>
            <td class="border p-2 font-semibold ${row.type === "Redeem" ? "text-red-600" : "text-green-600"}">${row.type}</td>
            <td class="border p-2">${row.buyer}</td>
            <td class="border p-2">${row.item}</td>
            <td class="border p-2 font-bold">${row.points}</td>
            <td class="border p-2">${row.remaining}</td>
            <td class="border p-2">${row.staff}</td>
          `;
          body.appendChild(tr);
        });

        showToast("✅ History loaded successfully!", "success");

      } catch (err) {
        console.error(err);
        showToast("Failed to load history", "error");
      }
    });

    function goBack() { window.location.href = "transaction.html"; }
  </script>
</body>
</html>
